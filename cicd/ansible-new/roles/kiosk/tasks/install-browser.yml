---
- name: Install ARMv6-compatible browser
  become: yes
  apt:
    name: "{{ kiosk_browser_package }}"
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Verify browser executable exists
  become: yes
  stat:
    path: /usr/bin/{{ kiosk_browser_executable }}
  register: browser_bin

- name: Fail if browser executable not found
  fail:
    msg: "Browser executable {{ kiosk_browser_executable }} not found in /usr/bin"
  when: not browser_bin.stat.exists