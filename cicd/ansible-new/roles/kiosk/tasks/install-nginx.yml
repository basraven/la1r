---
- name: Install nginx
  become: yes
  apt:
    name: nginx
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Ensure web root directory exists
  become: yes
  file:
    path: "{{ kiosk_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy nginx site configuration
  become: yes
  template:
    src: nginx-kiosk.conf.j2
    dest: "/etc/nginx/sites-available/{{ kiosk_nginx_site }}"
    mode: '0644'

- name: Enable nginx site
  become: yes
  file:
    src: "/etc/nginx/sites-available/{{ kiosk_nginx_site }}"
    dest: "/etc/nginx/sites-enabled/{{ kiosk_nginx_site }}"
    state: link

- name: Disable default nginx site
  become: yes
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Ensure nginx service is running
  become: yes
  service:
    name: nginx
    state: started
    enabled: yes