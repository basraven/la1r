---
- name: Install X11 packages
  become: yes
  apt:
    name: "{{ kiosk_x11_packages }}"
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Ensure X11 directory exists
  become: yes
  file:
    path: /home/{{ kiosk_autologin_user }}/.X11
    state: directory
    owner: "{{ kiosk_autologin_user }}"
    group: "{{ kiosk_autologin_user }}"
    mode: '0755'

- name: Ensure xinitrc directory exists
  become: yes
  file:
    path: /home/{{ kiosk_autologin_user }}/.xinitrc.d
    state: directory
    owner: "{{ kiosk_autologin_user }}"
    group: "{{ kiosk_autologin_user }}"
    mode: '0755'