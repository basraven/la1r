---
# Reset UFW and load all host-specific variables.
# This ensures a clean slate and loads configurations from both:
# 1. inventory/host_vars/<host>/ufw.yml (for custom rules)
# 2. inventory/host_vars/<host>/ufw-apps/*.yml (for application profiles)

- name: Reset UFW to default state
  become: yes
  command: ufw --force reset
  check_mode: no

- name: Include vars from main ufw.yml if present
  include_vars:
    file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/ufw.yml"
  when: "(inventory_dir + '/host_vars/' + inventory_hostname + '/ufw.yml') is file"

- name: Include vars from ufw-apps/ if present
  include_vars:
    dir: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/ufw-apps"
    extensions: ["yml", "yaml"]
  when: "(inventory_dir + '/host_vars/' + inventory_hostname + '/ufw-apps') is directory"

# Generic UFW role – installs UFW, configures application profiles, custom rules
# Variables expected (per host or group):
#   ufw_packages: [list] – packages to install
#   ufw_enable_logging: bool
#   ufw_app_*: dicts per application (e.g. ufw_app_kubernetes)
#       title, description, ports keys required
#   ufw_enable_applications: list (optional) – extra application profiles to enable
#   ufw_custom_rules: list of args for ansible.posix.ufw module

- name: Install UFW packages
  become: yes
  apt:
    name: "{{ ufw_packages | default(['ufw']) }}"
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Enable UFW logging (if requested)
  become: yes
  command: ufw logging on
  when: ufw_enable_logging | default(false)

- name: Gather UFW application definitions from variables (ufw_app_*)
  set_fact:
    _ufw_app_defs: "{{ _ufw_app_defs | default({}) | combine({ (item.key | regex_replace('^ufw_app_','')): item.value }) }}"
  loop: "{{ vars | dict2items | selectattr('key','match','^ufw_app_') }}"
  loop_control:
    label: "{{ item.key }}"

- name: Build list of applications to enable (managed list)
  set_fact:
    # Enable any explicitly requested profiles plus all app definitions collected
    _apps_to_enable: "{{ (ufw_enable_applications | default([])) + (_ufw_app_defs.keys() | list) }}"

# -----------------------------------------------------------------------------
# Purge unmanaged application profile files
# -----------------------------------------------------------------------------
- name: Find existing UFW application files on host
  become: yes
  find:
    paths: /etc/ufw/applications.d
    file_type: file
  register: _existing_apps

- name: Remove unmanaged UFW application files
  become: yes
  file:
    path: "{{ item.path }}"
    state: absent
  loop_control:
    label: "{{ item.path | basename }}"
  loop: "{{ _existing_apps.files | rejectattr('path','search','/etc/ufw/applications.d/README') | list }}"
  when: "(item.path | basename) not in _apps_to_enable"

- name: Create UFW application profile files
  become: yes
  copy:
    content: |
      [{{ item.key }}]
      title={{ item.value.title }}
      description={{ item.value.description }}
      ports={{ item.value.ports }}
    dest: "/etc/ufw/applications.d/{{ item.key }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _ufw_app_defs | dict2items }}"

- name: Reload UFW to discover new application profiles
  become: yes
  command: ufw reload
  check_mode: no



- name: Ensure UFW is enabled
  become: yes
  ufw:
    state: enabled
  check_mode: no

- name: Enable UFW application profiles
  become: yes
  ufw:
    rule: allow
    name: "{{ item }}"
  loop_control:
    label: "{{ item }}"
  loop: "{{ _apps_to_enable | unique }}"

- name: Apply custom UFW rules
  become: yes
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    from_ip: "{{ item.from_ip | default(omit) }}"
    to_ip: "{{ item.to_ip | default(omit) }}"
    interface: "{{ item.interface | default(omit) }}"
    direction: "{{ item.direction | default(omit) }}"
    route: "{{ item.route | default(omit) }}"
  loop: "{{ ufw_custom_rules | default([]) }}"
