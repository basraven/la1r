---
# WireGuard jail parsing /var/log/syslog for kernel messages
# Triggers on handshake/auth failures regardless of UFW policy
fail2ban_jail_wireguard:
  enabled: true
  port: 51820
  filter: kernel-wireguard
  backend: auto
  logpath: /var/log/syslog
  banaction: iptables-allports
  protocol: udp
  maxretry: 6
  findtime: 10m
  bantime: 1h
