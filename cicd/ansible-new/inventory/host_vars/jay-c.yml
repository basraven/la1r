---
ansible_host: 192.168.5.3
ha_proxy_settings:
  node_state: BACKUP
  node_state_sec: MASTER
  node_prio: 50
  node_prio_sec: 100
  node_interface: "enp4s0"
  keepalived_peers:
    - 192.168.5.1

nfs_storage_capabilities:
  - 111
  - 211
  - 221
  - 112
  - 212
  - 222


samba_shares:

  media_shares:
    - name: "basraven"
      comment: "Media Bas"
      path: "/mnt/hdd/media/bas"
    - name: "stephanie"
      comment: "Media Stephanie"
      path: "/mnt/hdd/media/stephanie"
    - name: "gezin"
      comment: "Media Gezin"
      path: "/mnt/hdd/media/gezin"


  special_write_shares:
    - name: "torrent"
      comment: "Torrent"
      path: "/mnt/hdd/torrent"
    - name: "windowsbackup"
      comment: "Windows Backup"
      path: "/mnt/hdd/windowsbackup"
    - name: "staging"
      comment: "Staging folder"
      path: "/mnt/hdd/staging"

  backup_shares:
    - name: "hdd-media"
      comment: "Backup - Media"
      path: "/mnt/hdd/media"
    - name: "hdd-na"
      comment: "Backup - hdd-na"
      path: "/mnt/hdd/na"
    - name: "hdd-ha"
      comment: "Backup - hdd-ha"
      path: "/mnt/hdd/ha"
    - name: "ssd-na"
      comment: "Backup - ssd-na"
      path: "/mnt/ssd/na"
    - name: "ssd-ha"
      comment: "Backup - ssd-ha"
      path: "/mnt/ssd/ha"
