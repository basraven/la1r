---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: authentik-opencode
  namespace: development
spec:
  forwardAuth:
    address: http://authentik.security.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    # NOTE: Authorization is deliberately NOT copied from the Authentik response.
    # opencode's web server uses HTTP Basic auth (OPENCODE_SERVER_PASSWORD); an
    # Authentik-injected Bearer token in Authorization would clobber it. Let the
    # client's Basic credentials pass through to opencode instead.
    authResponseHeaders:
      - X-Forwarded-User
      - X-authentik-username
      - X-authentik-email
      - X-authentik-groups
      - X-authentik-uid
      - X-authentik-name
    authRequestHeaders:
      - X-Forwarded-Method
      - X-Forwarded-Proto
      - X-Forwarded-Host
      - X-Forwarded-Uri
      - Cookie
