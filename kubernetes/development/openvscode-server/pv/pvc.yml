apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openvscode-server-home-claim
spec:
  storageClassName: openvscode-server-home
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
