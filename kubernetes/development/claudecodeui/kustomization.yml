apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: development
resources:
  - claudecodeui.yml
  - middleware.yml
  - container-build.yml
configMapGenerator:
- name: claudecodeui-init
  files:
  - init.sh
- name: claudecodeui-dockerfile
  files:
  - Dockerfile
- name: claudecodeui-install-tools
  files:
  - ../common/install-tools.sh
generatorOptions:
  disableNameSuffixHash: true
