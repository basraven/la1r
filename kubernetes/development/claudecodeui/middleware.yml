---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: sablier-claudecodeui
  namespace: development
spec:
  plugin:
    sablier:
      group: claudecodeui
      # blocking:
      #   defaultTimeout: 10s
      dynamic:
        displayName: Claude Code UI
        refreshFrequency: 5s
        showDetails: "true"
        theme: shuffle
      sablierUrl: http://sablier:10000
      sessionDuration: 90m