
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudecodeui
  namespace: development
  labels:
    app: claudecodeui
    # sablier.enable: "true"
    # sablier.group: claudecodeui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claudecodeui
  template:
    metadata:
      labels:
        task: development
        app: claudecodeui
    spec:
      priorityClassName: development-priority
      containers:
      - name: claudecodeui
        ports:
        - containerPort: 3001
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        image: registry.registry.svc.cluster.local:5000/claudecodeui:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_PATH
          value: "/home/basraven/.claudecodeui"
        - name: HOME
          value: "/home/basraven"

        - name: WORKSPACES_ROOT
          value: "/home/basraven/projects"
        - name: ANTHROPIC_BASE_URL
          value: "https://api.deepseek.com/anthropic"
        - name: ANTHROPIC_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: deepseek-apikey
              key: ANTHROPIC_AUTH_TOKEN
        - name: API_TIMEOUT_MS
          value: "600000"
        - name: ANTHROPIC_MODEL
          value: "deepseek-v4-flash"
        - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
          value: "deepseek-v4-flash"
        - name: ANTHROPIC_DEFAULT_SONNET_MODEL
          value: "deepseek-v4-flash"
        - name: ANTHROPIC_DEFAULT_OPUS_MODEL
          value: "deepseek-v4-flash"
        - name: CLAUDE_CODE_SUBAGENT_MODEL
          value: "deepseek-v4-flash"
        - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
          value: "1"
        - name: CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK
          value: "1"
        - name: CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS
          value: "true"
        command: ["/bin/sh", "-c"]
        args:
        - /init.sh
        volumeMounts:
        - name: openvscode-server-home-volume
          mountPath: /home
        - name: claudecodeui-init
          mountPath: /init.sh
          subPath: init.sh
        - name: install-tools
          mountPath: /install-tools.sh
          subPath: install-tools.sh
      volumes:
      - name: openvscode-server-home-volume
        persistentVolumeClaim:
          claimName: openvscode-server-home-claim
      - name: claudecodeui-init
        configMap:
          name: claudecodeui-init
          items:
          - key: init.sh
            path: init.sh
          defaultMode: 0755
      - name: install-tools
        configMap:
          name: install-tools
          items:
          - key: install-tools.sh
            path: install-tools.sh
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: claudecodeui
  namespace: development
spec:
  ports:
  - port: 80
    targetPort: 3001
  selector:
    app: claudecodeui
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: claudecodeui-bas
  namespace: development
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: claudecodeui-bas-tls
  commonName: claude.bas
  dnsNames:
  - claude.bas
  - www.claude.bas
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claudecodeui-https
  namespace: development
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # sablier middleware removed — uncomment to re-enable:
    # traefik.ingress.kubernetes.io/router.middlewares: "development-sablier-claudecodeui@kubernetescrd"
spec:
  tls:
  - secretName: claudecodeui-bas-tls
  rules:
  - host: claude.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: claudecodeui
            port:
              number: 80