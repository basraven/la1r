model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4-Flash-0731
      api_key: os.environ/DEEPINFRA_API_KEY
      timeout: 300
    model_info:
      # id: litellm registers model_info into litellm.model_cost under this id.
      # Without it, get_max_tokens("deepseek-v4-flash") can't resolve the model
      # and the modify_params clamp below silently no-ops (returns the request's
      # 384k output unchanged). Make the id match the model_name so the clamp
      # can cap output.
      id: deepseek-v4-flash
      # 1M input window (DeepSeek's real cap); cap output so input+output never
      # overflows 1,048,576 (codex asked for 384k output on a 664k context → overflow).
      # 65536 = 1,048,576 - 950,000 (codex auto-compact limit) keeps a ~33k margin
      # at the worst-case pre-compaction input.
      max_input_tokens: 1000000
      max_output_tokens: 65536

litellm_settings:
  # Codex sends parallel_tool_calls/reasoning_effort, which DeepInfra doesn't
  # support — drop unsupported params instead of 400ing.
  drop_params: true
  # Allow litellm to modify request params. Required for the built-in
  # get_modified_max_tokens() clamp to run: it caps max_tokens at
  # model_info.max_output_tokens, so codex's hardcoded 384k output request can't
  # overflow the 1M window (without this, the model_info caps only show up in
  # /v1/models and are never enforced on the /v1/responses path).
  modify_params: true
  # Enforce the output cap via a pre-call deployment hook (see clamp_output.py).
  # Belt-and-suspenders over modify_params: this clamps the outgoing request's
  # max_tokens/max_output_tokens directly, regardless of whether the built-in
  # clamp resolves the model. Module is mounted at /app/clamp_output.py.
  callbacks:
  - clamp_output.clamp_output

router_settings:
  num_retries: 2
  retry_after: 5.0
  # Reroute codex's default/fallback GPT model names to the only model the
  # gateway exposes (deepseek). codex may request gpt-5.x from stale sessions or
  # its built-in model list; aliases rewrite those to deepseek-v4-flash.
  #
  # NOTE: this MUST be `router_settings.model_group_alias`. The older
  # `litellm_settings.aliases` key is inert in litellm 1.96.2 (it never populates
  # `litellm.model_alias_map`), so it silently failed to rewrite gpt-5.x names
  # and every gpt-5.x request hit the router with the un-aliased name → 400
  # "Invalid model name" (after the key-scope fix moved it past auth).
  model_group_alias:
    gpt-5.5: deepseek-v4-flash
    gpt-5.4: deepseek-v4-flash
    gpt-5.4-mini: deepseek-v4-flash
    gpt-5.6: deepseek-v4-flash
    gpt-5.6-sol: deepseek-v4-flash

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  set_verbose: true