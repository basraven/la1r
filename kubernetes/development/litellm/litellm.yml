apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: development
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        task: development
        app: litellm
    spec:
      priorityClassName: development-priority
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-stable
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        args:
        - --config
        - /app/config.yaml
        - --port
        - "4000"
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-master-key
              key: LITELLM_MASTER_KEY
        - name: LITELLM_CONFIG_FILE_PATH
          value: "/app/config.yaml"
        - name: DEEPINFRA_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-master-key
              key: DEEPINFRA_API_KEY
        volumeMounts:
        - name: litellm-config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: litellm-config
        configMap:
          name: litellm-config
          items:
          - key: config.yaml
            path: config.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: development
spec:
  ports:
  - port: 80
    targetPort: 4000
  selector:
    app: litellm

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: litellm-bas
  namespace: development
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: litellm-bas-tls
  commonName: litellm.bas
  dnsNames:
  - litellm.bas

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-https
  namespace: development
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  tls:
  - secretName: litellm-bas-tls
  rules:
  - host: litellm.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: litellm
            port:
              number: 80
