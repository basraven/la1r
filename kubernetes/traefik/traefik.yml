---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: lan
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: traefik-ingress-controller
  namespace: traefik
  labels:
    app: traefik-ingress-controller
spec:
  selector:
    matchLabels:
      name: traefik-ingress-controller
  template:
    metadata:
      labels:
        app: traefik-ingress-controller
        name: traefik-ingress-controller
      annotations:
        seb_scrape: "true"                     # Tells Prometheus to scrape metrics for Seb
        # prometheus.io/scrape: "true"         # Tells Prometheus to scrape metrics
        prometheus.io/port: "8082"             # Port where metrics are exposed
        prometheus.io/path: "/metrics"         # The path for the metrics endpoint
    spec:
      serviceAccountName: traefik-ingress-controller
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - jay-c
      containers:
      - name: traefik-ingress-controller
        image: traefik:v2.9
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        - name: admin
          containerPort: 8080
        - name: prometheus
          containerPort: 8082
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                # Count occurrences of the error message in the log
                count=$(grep -o "configuration: invalid middleware type or middleware does not exist" /tmp/traefik.log | wc -l)
                if [ "$count" -ge 3 ]; then
                  exit 1 # Fail the probe if 3 or more errors are found
                fi
                # Count occurrences kubernetes api-server connection lost: "ended with: an error on the server"
                count=$(grep -o "ended with: an error on the server" /tmp/traefik.log | wc -l)
                if [ "$count" -ge 2 ]; then
                  exit 1 # Fail the probe if 1 or more errors are found
                fi
                exit 0 # Pass the probe if the error occurs less than 3 times
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 1
        args:
          - --api.dashboard=true
          - --api.insecure=true
          - --metrics=true
          - --metrics.prometheus=true
          - --metrics.prometheus.entryPoint=metrics
          - --metrics.prometheus.addRoutersLabels=true
          - --entrypoints.metrics.Address=:8082
          - --entrypoints.web.Address=:80
          - --entrypoints.websecure.Address=:443
          - --entrypoints.jellyfin.Address=:8096
          - --entrypoints.websecure.http.tls
          - --providers.kubernetesingress
          - --providers.kubernetesIngress.ingressClass=lan
          - --providers.kubernetesingress.ingressendpoint.ip=192.168.6.2
          - --providers.kubernetesIngress.allowEmptyServices=true
          - --providers.kubernetesCRD
          - --providers.kubernetesCRD.allowCrossNamespace=true
          - --providers.kubernetescrd.allowexternalnameservices=true
          - --experimental.plugins.sablier.modulename=github.com/sablierapp/sablier
          - --experimental.plugins.sablier.version=v1.8.5
          # - --log.filePath=/tmp/traefik.log
          - --log.level=INFO
          # - --accesslog
          # - --serverstransport.insecureskipverify
---
kind: Service
apiVersion: v1
metadata:
  name: traefik-ingress-service
  namespace: traefik
spec:
  type: ClusterIP
  selector:
    app: traefik-ingress-controller
  ports:
    - name: web
      protocol: TCP
      port: 80
    - name: websecure
      protocol: TCP
      port: 443
    - name: admin
      protocol: TCP
      port: 8080
    - name: jellyfin
      protocol: TCP
      port: 8096
    - name: prometheus
      port: 8082
      
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-loadbalancer-service
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: traefik.bas
spec:
  loadBalancerIP: 192.168.6.2
  type: LoadBalancer
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 80
    - name: websecure
      protocol: TCP
      port: 443
      targetPort: 443
    - name: admin
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: jellyfin
      protocol: TCP
      port: 8096
      targetPort: 8096
  selector:
    app: traefik-ingress-controller
---
# Generic Redirect to https
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: http-redirect-to-https
  namespace: traefik
spec:
  redirectScheme:
    scheme: https  

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-bas
  namespace: traefik
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: traefik-bas-tls
  commonName: traefik.bas
  dnsNames:
  - traefik.bas
  - www.traefik.bas

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-https
  namespace: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-auth-traefik@kubernetescrd"
spec:
  ingressClassName: lan
  tls:
  - secretName: traefik-bas-tls
  rules:
  - host: traefik.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traefik-ingress-service
            port:
              number: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-http
  namespace: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-http-redirect-to-https@kubernetescrd"
spec:
  ingressClassName: lan
  rules:
  - host: traefik.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traefik-ingress-service
            port:
              number: 8080
