---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: lan
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-ingress-controller
  namespace: traefik
  labels:
    app: traefik-ingress-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      name: traefik-ingress-controller
  template:
    metadata:
      labels:
        app: traefik-ingress-controller
        name: traefik-ingress-controller
    spec:
      # Essential
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: la1r.workload/essential
                operator: In
                values:
                - "true"
      priorityClassName: essential
      serviceAccountName: traefik-ingress-controller
      containers:
      - name: traefik-ingress-controller
        image: traefik:v2.9
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        - name: jellyfin
          containerPort: 8096
        - name: admin
          containerPort: 8080
        - name: prometheus
          containerPort: 8082
        args:
          - --api.dashboard=true
          - --api.insecure=true
          - --metrics=true
          - --serverstransport.insecureskipverify
          - --metrics.prometheus=true
          - --metrics.prometheus.entryPoint=metrics
          - --entrypoints.metrics.Address=:8082
          - --entrypoints.web.Address=:80
          - --entrypoints.websecure.Address=:443
          - --entrypoints.websecure.http.tls
          - --entrypoints.jellyfin.Address=:8096
          - --providers.kubernetesingress
          - --providers.kubernetesIngress.ingressClass=lan
          - --providers.kubernetesingress.ingressendpoint.ip=192.168.6.2
          - --providers.kubernetesIngress.allowEmptyServices=true
          - --providers.kubernetescrd
          # - --experimental.plugins.sablier.modulename=github.com/sablierapp/sablier
          # - --experimental.plugins.sablier.version=v1.8.1
          - --experimental.localPlugins.sablier.moduleName=github.com/sablierapp/sablier
          - --log.level=DEBUG
          # - --accesslog
        volumeMounts:
        - name: plugins-local
          mountPath: /plugins-local
      volumes:
      - name: plugins-local
        hostPath:
          path: /tmp/sablier-custom/plugins-local
---
kind: Service
apiVersion: v1
metadata:
  name: traefik-ingress-service
  namespace: traefik
spec:
  type: ClusterIP
  selector:
    app: traefik-ingress-controller
  ports:
    - protocol: TCP
      port: 80
      name: web
    - protocol: TCP
      port: 443
      name: websecure
    - protocol: TCP
      port: 8080
      name: admin
    - port: 8082
      name: prometheus
    - port: 8096
      name: jellyfin
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-loadbalancer-service
  namespace: traefik
spec:
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 80
    - name: websecure
      protocol: TCP
      port: 443
      targetPort: 443
    - name: admin
      protocol: TCP
      port: 8080
      targetPort: 8080
    - port: 8096
      name: jellyfin
      protocol: TCP
  selector:
    app: traefik-ingress-controller
  type: LoadBalancer
  loadBalancerIP: 192.168.6.2
---
# Generic Redirect to https
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: http-redirect-to-https
  namespace: traefik
spec:
  redirectScheme:
    scheme: https  

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-bas
  namespace: traefik
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: traefik-bas-tls
  commonName: traefik.bas
  dnsNames:
  - traefik.bas
  - www.traefik.bas

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-https
  namespace: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  tls:
  - secretName: traefik-bas-tls
  rules:
  - host: traefik.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traefik-ingress-service
            port:
              number: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-http
  namespace: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-http-redirect-to-https@kubernetescrd"
spec:
  rules:
  - host: traefik.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traefik-ingress-service
            port:
              number: 8080
