apiVersion: apps/v1
kind: Deployment
metadata:
  name: sablier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sablier
  template:
    metadata:
      labels:
        app: sablier
    spec:
      priorityClassName: traefik-priority
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - jay-c

      serviceAccountName: sablier
      tolerations:
      - key: "la1r.workload/specificonly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: sablier
        image: sablierapp/sablier:1.8.5
        args: 
        - "start"
        - "--provider.name=kubernetes"
        ports:
        - name: sablier
          containerPort: 10000
        # volumeMounts:
        # - name: script-volume
        #   mountPath: /etc/sablier/sablier.yaml
        #   subPath: sablier.yaml
        # env:
        # - name: PROVIDER_NAME
        #   value: kubernetes
        # - name: FRIGATE_DISCORD_WEBHOOK
        #   valueFrom:
        #     secretKeyRef:
        #       name: discord-webhooks
        #       key: FRIGATE_DISCORD_WEBHOOK
      volumes:
      - name: script-volume
        configMap:
          name: sablier-script
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: sablier
  labels:
    name: sablier
spec:
  selector:
    app: sablier
  type: ClusterIP
  ports:
    - name: sablier
      port: 10000
      targetPort: 10000