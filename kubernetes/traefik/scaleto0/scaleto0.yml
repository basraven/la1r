apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaleto0
  namespace: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaleto0
  template:
    metadata:
      labels:
        app: scaleto0
    spec:
      
      # Essential
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: la1r.workload/essential
                operator: In
                values:
                - "true"
      priorityClassName: essential

      containers:
      - name: scaleto0
        image: python:3.9-slim
        command: ["sh", "-c", "pip install requests watchdog kubernetes protobuf==3.20.* && python /scripts/scaleto0.py"]
        # command: ["sh", "-c", "pip install requests watchdog kubernetes protobuf==3.20.* && sleep 10000000"]
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
        - name: kubernetes-config
          mountPath: /etc/kubernetes
        - name: scaleto0-override
          mountPath: /etc/scaleto0/override
        env:
        - name: RECHECK_INTERVAL
          value: "60" # in seconds
        - name: CONTROLLER_IP
          value: "192.168.5.2"
        - name: CONTROLLER_PORT
          value: "50505"
        - name: TARGET_DEVICE_NUMBER
          value: "3"
        - name: OVERRIDE_FILE
          value: "/etc/scaleto0/scaleto0-override"
        - name: TARGETNODE_LABEL
          value: "la1r.workload/nonessential=true" # in seconds
      volumes:
      - name: script-volume
        configMap:
          name: scaleto0-script
      - name: kubernetes-config
        hostPath:
          path: /etc/kubernetes
          type: Directory
      - name: scaleto0-override
        hostPath:
          path: /etc/scaleto0/override
          type: FileOrCreate
      restartPolicy: Always
