---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pihole-external-dns
  namespace: dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pihole-external-dns
rules:
- apiGroups: [""]
  resources: ["services","pods", "endpoints"]
  verbs: ["get","watch","list"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get","watch","list"]
- apiGroups: ["extensions","networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get","watch","list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pihole-external-dns-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pihole-external-dns
subjects:
- kind: ServiceAccount
  name: pihole-external-dns
  namespace: dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-external-dns
  namespace: dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole-external-dns
  template:
    metadata:
      labels:
        app: pihole-external-dns
    spec:
      priorityClassName: dns-priority
      serviceAccountName: pihole-external-dns
      securityContext:
        fsGroup: 65534
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - jay-c
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.22.0
        args:
        # ExternalDNS v0.18+ requires the EndpointSlice source on clusters >= 1.33.
        - --source=service
        - --source=ingress
        - --policy=upsert-only
        - --registry=noop
        - --provider=pihole
        # Pi-hole v6 API base; the provider appends /api/config/dns/...
        - --pihole-server=http://pihole:80
        - --domain-filter=bas
        # Pi-hole v6 API password (set via FTLCONF_webserver_api_password on the
        # Pi-hole deployment). The provider reads EXTERNAL_DNS_PIHOLE_PASSWORD.
        env:
        - name: EXTERNAL_DNS_PIHOLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pihole-credentials
              key: API_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
