---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: dns
  labels:
    app: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pihole
    spec:
      priorityClassName: dns-priority
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - jay-c
      containers:
      - name: pihole
        image: pihole/pihole:2026.09.0
        ports:
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 80
          name: web
        - containerPort: 443
          name: web-ssl
        # Pi-hole v6 configuration. FTLCONF_* variables map to keys in pihole.toml
        # (FTLCONF_<section>_<setting>). See docs.pi-hole.net/docker/configuration.
        env:
        - name: TZ
          value: "Europe/Amsterdam"
        - name: FTLCONF_webserver_api_password
          value: ""
        - name: FTLCONF_webserver_port
          value: "80,443s"
        - name: FTLCONF_webserver_interface_theme
          value: "default-light"
        - name: FTLCONF_dns_listeningMode
          value: "all"
        - name: FTLCONF_dns_upstreams
          value: "8.8.8.8;8.8.4.4"
        - name: FTLCONF_dns_domainNeeded
          value: "true"
        - name: FTLCONF_dns_bogusPriv
          value: "true"
        # Required on the first v6 start so custom files in /etc/dnsmasq.d are
        # migrated into the new configuration.
        - name: FTLCONF_misc_etc_dnsmasq_d
          value: "true"
        volumeMounts:
        - name: pihole-data
          mountPath: /etc/pihole
        - name: pihole-dnsmasq
          mountPath: /etc/dnsmasq.d
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        # resources:
        #   requests:
        #     memory: "128Mi"
        #     cpu: "100m"
        #   limits:
        #     memory: "512Mi"
        #     cpu: "500m"
        livenessProbe:
          httpGet:
            path: /admin/
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /admin/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: pihole-data
        persistentVolumeClaim:
          claimName: pihole-data-claim
      - name: pihole-dnsmasq
        persistentVolumeClaim:
          claimName: pihole-dnsmasq-claim

---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: dns
spec:
  selector:
    app: pihole
  type: ClusterIP
  ports:
  - name: web
    port: 80
    targetPort: 80
  - name: web-ssl
    port: 443
    targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-loadbalancer-service
  namespace: dns
spec:
  loadBalancerIP: 192.168.6.91
  type: LoadBalancer
  ports:
  - name: dns-udp
    protocol: UDP
    targetPort: dns-udp
    port: 53
  - name: dns-tcp
    protocol: TCP
    targetPort: dns-tcp
    port: 53
  selector:
    app: pihole
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pihole-dns
  namespace: dns
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: pihole-dns-tls
  commonName: dns.bas
  dnsNames:
  - dns.bas
  - pihole.bas
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole-https
  namespace: dns
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "dns-pihole-redirect-to-admin@kubernetescrd,dns-authentik-pihole@kubernetescrd"
spec:
  ingressClassName: lan
  tls:
  - secretName: pihole-dns-tls
    hosts:
    - dns.bas
    - pihole.bas
  rules:
  - host: dns.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pihole
            port:
              number: 80
  - host: pihole.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pihole
            port:
              number: 80
