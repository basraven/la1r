---
# PriorityClass for dns workloads
# Sits below system-critical (2000000000) but above default (0)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dns-priority
value: 500000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Higher priority for dns pods to prevent eviction under node pressure"
