---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enshrouded-traffic-watcher
  namespace: gaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enshrouded-traffic-watcher
  template:
    metadata:
      labels:
        app: enshrouded-traffic-watcher
    spec:
      # Run on the same node as the enshrouded server for network visibility
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: la1r.workload/nonessential
      #           operator: In
      #           values:
      #           - "true"
      # Need host network to see traffic on the host IP
      hostNetwork: true
      serviceAccountName: enshrouded-traffic-watcher
      containers:
      - name: traffic-watcher
        image: alpine:latest
        securityContext:
          # Need CAP_NET_RAW to use tcpdump
          capabilities:
            add: ["NET_RAW", "NET_ADMIN"]
          runAsUser: 0  # Run as root for network access
        command: ["/bin/sh"]
        args:
        - -c
        - |
          # Install necessary packages
          apk add --no-cache tcpdump curl jq

          # Set up API server URL and token
          # When using hostNetwork: true, we need to use the API server IP directly
          API_SERVER="https://192.168.5.3:6443"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA_CERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

          # Helper function for timestamped logging
          log() {
            echo "$(date +"%Y-%m-%d %H:%M:%S") $*"
          }

          # Function to get whitelist from ConfigMap
          get_whitelist() {
            local response
            response=$(curl -s --cacert "$CA_CERT" --header "Authorization: Bearer $TOKEN" \
              "$API_SERVER/api/v1/namespaces/$NAMESPACE/configmaps/enshrouded-whitelist")
            if echo "$response" | jq -e '.data.ips' > /dev/null 2>&1; then
              echo "$response" | jq -r '.data.ips'
            else
              echo "{}"
            fi
          }

          # Function to update whitelist in ConfigMap
          update_whitelist() {
            local ips_json=$1
            log "Updating whitelist ConfigMap with $(echo "$ips_json" | jq '. | length') IPs"
            PATCH_DATA="{\"data\":{\"ips\":\"$(echo "$ips_json" | sed 's/"/\\\\"/g')\"}}"
            curl -s --cacert "$CA_CERT" --header "Authorization: Bearer $TOKEN" \
              --header "Content-Type: application/strategic-merge-patch+json" \
              --request PATCH \
              --data "$PATCH_DATA" \
              "$API_SERVER/api/v1/namespaces/$NAMESPACE/configmaps/enshrouded-whitelist" > /dev/null
          }

          # Function to load whitelist from ConfigMap and populate local directory
          load_whitelist() {
            mkdir -p /tmp/registered_ips
            local ips_json
            ips_json=$(get_whitelist)
            log "Loaded whitelist: $ips_json"
            # Clear existing files
            rm -f /tmp/registered_ips/*
            # Create timestamp files for each IP
            echo "$ips_json" | jq -r 'to_entries[] | "\(.value) \(.key)"' | while read timestamp ip; do
              echo "$timestamp" > "/tmp/registered_ips/$ip"
            done
          }

          # Function to save local whitelist to ConfigMap
          save_whitelist() {
            # Build JSON object from files
            local json="{"
            local first=true
            for ip_file in /tmp/registered_ips/*; do
              if [ -f "$ip_file" ]; then
                ip=$(basename "$ip_file")
                read timestamp < "$ip_file" || timestamp=$(date +%s)
                if [ "$first" = true ]; then
                  first=false
                else
                  json="$json,"
                fi
                json="$json\"$ip\":$timestamp"
              fi
            done
            json="$json}"
            update_whitelist "$json"
          }

          # Function to check if enshrouded deployment is running
          check_deployment() {
            curl -s --cacert "$CA_CERT" --header "Authorization: Bearer $TOKEN" \
              "$API_SERVER/apis/apps/v1/namespaces/$NAMESPACE/deployments/enshrouded" | \
              jq -e '.spec.replicas > 0' > /dev/null 2>&1
          }

          # Function to scale deployment
          scale_deployment() {
            local replicas=$1
            log "Scaling enshrouded deployment to $replicas replicas"

            # Create patch data
            PATCH_DATA="{\"spec\":{\"replicas\":$replicas}}"

            # Send patch request
            curl -s --cacert "$CA_CERT" --header "Authorization: Bearer $TOKEN" \
              --header "Content-Type: application/strategic-merge-patch+json" \
              --request PATCH \
              --data "$PATCH_DATA" \
              "$API_SERVER/apis/apps/v1/namespaces/$NAMESPACE/deployments/enshrouded" > /dev/null
          }

          # Function to check tcpdump process and restart if needed
          check_tcpdump() {
            if ! kill -0 $TCPDUMP_PID 2>/dev/null; then
              log "tcpdump process ($TCPDUMP_PID) not found, restarting..."
              # Restart tcpdump
              tcpdump -i any udp and host 192.168.6.46 and \( port 15637 or port 27015 \) and not src host 31.150.234.16 -l -n > $PIPE 2>/dev/null &
              TCPDUMP_PID=$!
              log "tcpdump restarted with PID $TCPDUMP_PID"
              # Increment restart counter
              TCPDUMP_RESTART_COUNT=$((TCPDUMP_RESTART_COUNT + 1))
              log "tcpdump restart count: $TCPDUMP_RESTART_COUNT"
              # If restarted too many times in a short period, exit
              if [ $TCPDUMP_RESTART_COUNT -ge 5 ]; then
                log "tcpdump failed to stay alive after 5 restarts, exiting..."
                save_whitelist
                exit 1
              fi
            else
              # Reset counter if process is healthy
              TCPDUMP_RESTART_COUNT=0
            fi
          }

          # Test API connection
          log "Testing Kubernetes API connection..."
          if curl -s --cacert "$CA_CERT" --header "Authorization: Bearer $TOKEN" \
            "$API_SERVER/healthz" | grep -q "ok"; then
            log "API connection successful"
          else
            log "API connection failed, retrying in 5 seconds..."
            sleep 5
            # Try one more time
            if curl -s --cacert "$CA_CERT" --header "Authorization: Bearer $TOKEN" \
              "$API_SERVER/healthz" | grep -q "ok"; then
              log "API connection successful on retry"
            else
              log "Failed to connect to Kubernetes API"
              exit 1
            fi
          fi

          log "Starting rate-based traffic monitoring with false positive filtering"
          log "Monitoring UDP ports 15637 and 27015 for IP 192.168.6.46"
          log "Filtering out:"
          log "  - Known false positive IP: 31.150.234.16"
          log "Requiring 5 packets within 60 seconds from new IP to register session"
          log "Keeping server open while registered IPs send packets within 5 minutes"

          # IP tracking configuration
          idle_timeout=1800  # 30 minutes inactivity before removing registration
          check_interval=10  # Check for packets every 10 seconds
          traffic_window=40  # 40 seconds window for initial registration
          required_packets=5  # Need at least 5 packets within 40 seconds to register IP

          # Create named pipe for tcpdump output
          PIPE=/tmp/tcpdump.pipe
          rm -f $PIPE
          mkfifo $PIPE

          # Start tcpdump in background with IMPROVED FILTERS:
          # 1. Exclude known false positive IP (31.150.234.16)
          # 2. Only count traffic that passes this filter
          tcpdump -i any udp and host 192.168.6.46 and \( port 15637 or port 27015 \) and not src host 31.150.234.16 -l -n > $PIPE 2>/dev/null &
          TCPDUMP_PID=$!
          # Verify tcpdump started successfully
          sleep 1
          if ! kill -0 $TCPDUMP_PID 2>/dev/null; then
            log "ERROR: tcpdump failed to start, exiting..."
            exit 1
          fi

          # Trap to clean up on exit
          trap "kill $TCPDUMP_PID 2>/dev/null; rm -f $PIPE; save_whitelist; exit" INT TERM

          # Setup directories for IP tracking
          mkdir -p /tmp/ip_counts

          # Load existing whitelist from ConfigMap
          load_whitelist

          # Monitor the pipe
          exec 3< $PIPE
          iteration_count=0
          TCPDUMP_RESTART_COUNT=0
          while true; do
            # Check tcpdump health every iteration
            check_tcpdump

            # Try to read from pipe with timeout
            if read -t $check_interval -u 3 line; then
              # echo "DEBUG: Got packet: $line"
              # Extract source IP from tcpdump output
              # Format: "timestamp interface direction IP src_ip.src_port > dst_ip.dst_port: UDP, length XX"
              # Example: "23:32:24.873947 enp4s0 In IP 85.144.239.68.61602 > 192.168.6.46.15637: UDP, length 25"
              src_field=$(echo "$line" | awk '{print $5}')  # Gets "85.144.239.68.61602"
              src_ip=$(echo "$src_field" | sed 's/\.[0-9]*$//')  # Remove port: "85.144.239.68"
              # Debug: check if IP extraction failed
              if [ "$src_ip" = "IP" ] || [ -z "$src_ip" ]; then
                log "ERROR: IP extraction failed for line: $line"
                continue
              fi
              # Validate IP format (basic check)
              if ! echo "$src_ip" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                log "ERROR: Invalid IP format: $src_ip from line: $line"
                continue
              fi

              current_time=$(date +%s)
              ip_count_file="/tmp/ip_counts/$src_ip"
              registered_file="/tmp/registered_ips/$src_ip"

              # Check if IP is already registered
              if [ -f "$registered_file" ]; then
                # Update timestamp for registered IP
                echo "$current_time" > "$registered_file"
                # echo "Traffic from registered IP: $src_ip"

                # Ensure server is running for registered IP
                if ! check_deployment; then
                  log "Starting server for registered IP $src_ip"
                  scale_deployment 1
                fi
              else
                # IP not registered yet - track for registration
                if [ -f "$ip_count_file" ]; then
                  # Read existing count and timestamp
                  read count first_seen < "$ip_count_file" || count=0 first_seen=$current_time
                else
                  count=0
                  first_seen=$current_time
                fi

                # Check if window is still valid (60 seconds)
                time_since_first=$((current_time - first_seen))
                if [ $time_since_first -ge $traffic_window ]; then
                  # Window expired, reset count
                  count=1
                  first_seen=$current_time
                  log "Starting new registration window for IP: $src_ip"
                else
                  # Within window, increment count
                  count=$((count + 1))
                fi

                # Save updated count
                echo "$count $first_seen" > "$ip_count_file"

                # Check if reached threshold
                if [ $count -eq $required_packets ]; then
                  log "IP $src_ip registered (5 packets within 60 seconds)"
                  # Register IP
                  echo "$current_time" > "$registered_file"
                  # Remove count file
                  rm -f "$ip_count_file"
                  # Save whitelist to ConfigMap
                  save_whitelist

                  # Log all whitelisted IPs
                  whitelisted_ips=$(ls -1 /tmp/registered_ips/ 2>/dev/null | tr '\n' ' ')
                  log "Whitelisted IPs: $whitelisted_ips"

                  # Start server if not running
                  if ! check_deployment; then
                    log "Starting server for newly registered IP $src_ip"
                    scale_deployment 1
                  fi
                else
                  log "IP $src_ip: packet $count/$required_packets in registration window"
                fi
              fi
            fi

            # Clean up stale registrations (5 minutes inactivity)
            current_time=$(date +%s)
            for ip_file in /tmp/registered_ips/*; do
              if [ -f "$ip_file" ]; then
                read last_seen < "$ip_file" || last_seen=0
                time_since_active=$((current_time - last_seen))
                if [ $time_since_active -ge $idle_timeout ]; then
                  ip=$(basename "$ip_file")
                  log "Removing stale registration for IP: $ip (inactive for ${idle_timeout}s)"
                  rm -f "$ip_file"
                  # Save updated whitelist
                  save_whitelist
                  # Log updated whitelisted IPs
                  whitelisted_ips=$(ls -1 /tmp/registered_ips/ 2>/dev/null | tr '\n' ' ')
                  if [ -n "$whitelisted_ips" ]; then
                    log "Updated whitelisted IPs: $whitelisted_ips"
                  else
                    log "No remaining whitelisted IPs"
                  fi
                fi
              fi
            done

            # Clean up expired count files (older than traffic window)
            for count_file in /tmp/ip_counts/*; do
              if [ -f "$count_file" ]; then
                read count first_seen < "$count_file" || count=0 first_seen=0
                time_since_first=$((current_time - first_seen))
                if [ $time_since_first -ge $traffic_window ]; then
                  ip=$(basename "$count_file")
                  log "Cleaning expired count for IP: $ip"
                  rm -f "$count_file"
                fi
              fi
            done

            # Log whitelisted IPs every 60 seconds (60 iterations)
            if [ $((iteration_count % 60)) -eq 0 ]; then
              whitelisted_ips=$(ls -1 /tmp/registered_ips/ 2>/dev/null | tr '\n' ' ')
              if [ -n "$whitelisted_ips" ]; then
                log "Currently whitelisted IPs: $whitelisted_ips"
              fi
            fi

            # Check if we should scale down (no registered IPs)
            registered_count=$(ls -1 /tmp/registered_ips/ 2>/dev/null | wc -l)
            if [ $registered_count -eq 0 ]; then
              if check_deployment; then
                log "No registered IPs. Scaling enshrouded deployment down to 0"
                scale_deployment 0
              fi
            fi

            # Small sleep to prevent busy looping
            iteration_count=$((iteration_count + 1))
            sleep 1
          done
      automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enshrouded-traffic-watcher
  namespace: gaming

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enshrouded-traffic-watcher
  namespace: gaming
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enshrouded-traffic-watcher
  namespace: gaming
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enshrouded-traffic-watcher
subjects:
- kind: ServiceAccount
  name: enshrouded-traffic-watcher
  namespace: gaming

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: enshrouded-whitelist
  namespace: gaming
data:
  ips: ""
