---
apiVersion: backup.la1r.com/v1
kind: cloudbackup
metadata:
  name: cloudbackup-media
spec:
  cloud:
    type: s3-deeparchive
    bucket: la1r-cloud-backup
    region: us-east-1
    prefix: media/
    compression: 
      type: 7zip
      arguments: -m0=lzma2 -mx=9
    encryption:
      type: gpg
  sources:
    - name: "media"
      path: "/home/basraven/projects/la1r/kubernetes/backup/cloud-backup/media"
      target: "/home/basraven/projects/la1r/kubernetes/backup/cloud-backup/media-zipped"
      excludes:
      - media/top_3/folder_3013/folder_4589_notme
