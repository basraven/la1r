---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: letsencrypt-authentik-bas
  namespace: security
spec:
  issuerRef:
    name: letsencrypt-la1r
    kind: ClusterIssuer
  secretName: letsencrypt-authentik-bas-tls
  commonName: auth.la1r.com
  dnsNames:
  - auth.la1r.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: letsencrypt-authentik-https
  namespace: security
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # traefik.ingress.kubernetes.io/router.middlewares: "security-sablier-authentik@kubernetescrd"
spec:
  ingressClassName: lan
  tls:
  - secretName: letsencrypt-authentik-bas-tls
    hosts:
    - auth.la1r.com
  rules:
  - host: auth.la1r.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authentik
            port:
              number: 9000
