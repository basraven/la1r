---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sso
  namespace: kubernetes-dashboard

---
# Choose one binding; start with view for safety. Use cluster-admin for full control.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-sso-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: dashboard-sso
  namespace: kubernetes-dashboard


