---
# Example: Deployment that pulls the image built by the Job above.
# The image is served from the internal registry at registry.registry.svc.cluster.local.
#
# Apply via kustomize to auto-generate the Dockerfile ConfigMap:
#   kubectl apply -k kubernetes/registry/example
#
# Then delete the build Job to trigger a rebuild:
#   kubectl delete job example-hello-build-image -n registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-hello
  namespace: registry
  labels:
    app: example-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-hello
  template:
    metadata:
      labels:
        app: example-hello
    spec:
      containers:
      - name: nginx
        image: registry.registry.svc.cluster.local:5000/example-hello:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-hello
  namespace: registry
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: example-hello
