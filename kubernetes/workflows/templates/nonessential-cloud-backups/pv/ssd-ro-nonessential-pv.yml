---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: ssd-ro-nonessential-pv
  labels:
    contenttype: "ssd-ro-nonessential"
spec:
  capacity:
    storage: 1Gi
  storageClassName: ssd-ro-nonessential
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteMany
  hostPath:
    path: "/mnt/ssd/"

  # NonEssential
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: la1r.workload/nonessential
          operator: In
          values:
          - "true"
