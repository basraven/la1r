---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: nonessential-workingdir-pv
  labels:
    contenttype: "nonessential-workingdir"
spec:
  capacity:
    storage: 1Gi
  storageClassName: nonessential-workingdir
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteMany
  hostPath:
    path: "/tmp/workflows/nonessential/workingdir"

  # NonEssential
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: la1r.workload/nonessential
          operator: In
          values:
          - "true"
