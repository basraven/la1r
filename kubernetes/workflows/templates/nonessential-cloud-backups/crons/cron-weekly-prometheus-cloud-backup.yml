apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: weekly-prometheus-cloud-backup
spec:
  schedule: "30 12 * * 0" # Every Sunday at 12:30 AM
  concurrencyPolicy: "Forbid"
  timezone: "Europe/Amsterdam"
  workflowSpec:
    workflowTemplateRef:
      name: nonessential-cloud-backup
    arguments:
      parameters:
        - name: appname
          value: "prometheus"
        - name: localpath
          value: "/mnt/ssd/na/prometheus"
