apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: weekly-monica-cloud-backup
spec:
  schedule: "11 12 * * 0" # Every Sunday at 12:11 AM
  concurrencyPolicy: "Forbid"
  timezone: "Europe/Amsterdam"
  workflowSpec:
    workflowTemplateRef:
      name: nonessential-cloud-backup
    arguments:
      parameters:
        - name: appname
          value: "monica"
        - name: localpath
          value: "/mnt/ssd/na/monica"
