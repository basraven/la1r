apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: glacier-cloud-backup
  namespace: workflows
spec:
  entrypoint: glacier-cloud-backup
  podSpecPatch: |
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - jay-c
  arguments:
    parameters:
      - name: bucket
        value: "la1r-backup-glacier-backup-data"   # default bucket name
      - name: appname
      - name: storageclass
        value: "STANDARD_IA"
  volumes:
    - name: work # working dir
      persistentVolumeClaim:
        claimName: glacier-workingdir-claim
    - name: config
      configMap:
        name: glacier-backup-targets
  onExit: exit-handler
  templates:
    - name: glacier-cloud-backup
      dag:
        tasks:
          - name: list-targets
            template: list-targets
          - name: upload-backup
            depends: list-targets
            template: upload-backup
            arguments:
              parameters:
                - name: target
                  value: "{{item}}"
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: appname
                  value: "{{workflow.parameters.appname}}"
                - name: storageclass
                  value: "{{workflow.parameters.storageclass}}"
            withParam: "{{tasks.list-targets.outputs.parameters.targets}}"

    - name: list-targets
      container:
        image: debian:bullseye-slim
        command: [sh, -c]
        args:
          - |
            apt update && apt install -y jq
            grep '^  - /' /mnt/config/targets | sed 's/^  - //' | jq -R -s 'split("\n") | map(select(length > 0))' > /tmp/targets.json
        volumeMounts:
          - name: config
            mountPath: /mnt/config
            readOnly: true
      outputs:
        parameters:
          - name: targets
            valueFrom:
              path: /tmp/targets.json

    - name: compute-local-sha
      inputs:
        parameters:
          - name: target
      volumes:
      - name: hdd-ro-glacier
        persistentVolumeClaim:
          claimName: hdd-ro-glacier-claim
          readOnly: true
      container:
        image: debian:bullseye-slim
        command: [sh, -c]
        args:
          - |
            TARGET="{{inputs.parameters.target}}"
            echo "=== Computing SHA for $TARGET ==="
            mkdir -p "/mnt/work${TARGET}"
            find "$TARGET" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > "/mnt/work${TARGET}/backup.sha256"
            echo "SHA256: $(cat /mnt/work${TARGET}/backup.sha256)"
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: hdd-ro-glacier
            mountPath: /mnt/hdd
            readOnly: true

    - name: upload-backup
      inputs:
        parameters:
          - name: bucket
          - name: appname
          - name: storageclass
          - name: target
      dag:
        tasks:
          - name: check-s3-status
            template: check-s3-status
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: appname
                  value: "{{inputs.parameters.appname}}"

          - name: compute-local-sha
            template: compute-local-sha
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"

          - name: notify-create
            depends: check-s3-status
            template: notify-approval-required
            when: "{{tasks.check-s3-status.outputs.parameters.needs_approval}} == true"
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: appname
                  value: "{{inputs.parameters.appname}}"

          - name: approve-create
            depends: notify-create
            template: approve-upload
            when: "{{tasks.check-s3-status.outputs.parameters.needs_approval}} == true"

          - name: compare-sha
            depends: "check-s3-status && compute-local-sha"
            template: compare-sha
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"
                - name: s3_sha256
                  value: "{{tasks.check-s3-status.outputs.parameters.s3_sha256}}"

          - name: notify-change
            depends: compare-sha
            template: ntfy-send
            when: "{{tasks.compare-sha.outputs.parameters.status}} == change"
            arguments:
              parameters:
                - name: title
                  value: "{{workflow.parameters.appname}} backup - SHA mismatch"
                - name: message
                  value: "SHA mismatch for {{inputs.parameters.target}}. Local: {{tasks.compare-sha.outputs.parameters.local_sha256}} vs S3: {{tasks.check-s3-status.outputs.parameters.s3_sha256}}. Approve in Argo to proceed with upload if this was intentional."

          - name: approve-change
            depends: notify-change
            template: approve-change
            when: "{{tasks.compare-sha.outputs.parameters.status}} == change"

          - name: encrypt-and-upload
            depends: "compare-sha && (approve-create.Succeeded || approve-create.Skipped) && (approve-change.Succeeded || approve-change.Skipped)"
            template: encrypt-and-upload
            when: "{{tasks.compare-sha.outputs.parameters.status}} != skipped"
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: storageclass
                  value: "{{inputs.parameters.storageclass}}"

    - name: check-s3-status
      inputs:
        parameters:
          - name: target
          - name: bucket
          - name: appname
      container:
        image: amazon/aws-cli:latest
        command: [sh, -c]
        args:
          - |
            TARGET="{{inputs.parameters.target}}"
            TARGET_PATH=$(echo "$TARGET" | sed 's|^/mnt/hdd/||')
            BUCKET_PATH="${TARGET_PATH}.gpg"

            # Get existing object's sha256 tag from S3
            S3_SHA256=$(aws s3api get-object-tagging \
              --bucket "{{inputs.parameters.bucket}}" \
              --key "${BUCKET_PATH}" \
              --query "TagSet[?Key=='sha256'].Value | [0]" \
              --output text 2>/dev/null | tr -d '[:space:]')

            # AWS CLI returns "None" string when no matching tags found
            [ "$S3_SHA256" = "None" ] && S3_SHA256=""

            echo "S3 sha256: [$S3_SHA256]"

            if [ -z "$S3_SHA256" ]; then
              echo -n "true" > /tmp/needs_approval
            else
              echo -n "false" > /tmp/needs_approval
            fi

            echo -n "$S3_SHA256" > /tmp/s3_sha256
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: aws-credentials-volume
            mountPath: /root/.aws/credentials
            subPath: credentials
            readOnly: true
          - name: aws-config-volume
            mountPath: /root/.aws/config
            subPath: config
            readOnly: true
      volumes:
      - name: aws-credentials-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: credentials
              path: credentials
      - name: aws-config-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: config
              path: config
      outputs:
        parameters:
          - name: s3_sha256
            valueFrom:
              path: /tmp/s3_sha256
          - name: needs_approval
            valueFrom:
              path: /tmp/needs_approval

    - name: approve-upload
      suspend: {}

    - name: approve-change
      suspend: {}

    - name: compare-sha
      inputs:
        parameters:
          - name: target
          - name: s3_sha256
      container:
        image: debian:bullseye-slim
        command: [sh, -c]
        args:
          - |
            TARGET="{{inputs.parameters.target}}"
            LOCAL_SHA256=$(cat "/mnt/work${TARGET}/backup.sha256" | tr -d '[:space:]')
            S3_SHA256="{{inputs.parameters.s3_sha256}}"

            echo "Local SHA256: [$LOCAL_SHA256]"
            echo "S3 SHA256:    [$S3_SHA256]"

            if [ -z "$S3_SHA256" ]; then
              echo "Object does not exist in S3. Upload needed."
              echo -n "upload" > /tmp/status
            elif [ "$LOCAL_SHA256" = "$S3_SHA256" ]; then
              echo "SHA256 matches. Nothing to do."
              echo -n "skipped" > /tmp/status
            else
              echo "SHA256 mismatch! Possible bitrot or intentional update."
              echo -n "change" > /tmp/status
            fi

            echo -n "$LOCAL_SHA256" > /tmp/local_sha256
        volumeMounts:
          - name: work
            mountPath: /mnt/work
      outputs:
        parameters:
          - name: status
            valueFrom:
              path: /tmp/status
          - name: local_sha256
            valueFrom:
              path: /tmp/local_sha256

    - name: encrypt-and-upload
      inputs:
        parameters:
          - name: target
          - name: bucket
          - name: storageclass
      container:
        image: debian:bullseye-slim
        command: [bash, -c]
        args:
          - |
            set -euo pipefail

            TARGET="{{inputs.parameters.target}}"
            TARGET_PATH=$(echo "$TARGET" | sed 's|^/mnt/hdd/||')
            BUCKET_PATH="${TARGET_PATH}.gpg"
            NEW_SHA256=$(cat "/mnt/work${TARGET}/backup.sha256" | tr -d '[:space:]')

            echo "=== Installing dependencies ==="
            apt update > /dev/null 2>&1 && apt install -y tar gzip gnupg awscli > /dev/null 2>&1

            WORK_DIR="/mnt/work${TARGET}"
            echo "=== Encrypting $TARGET ==="
            tar -czf "${WORK_DIR}/backup.tar.gz" "$TARGET"
            gpg --batch --no-tty --yes --output "${WORK_DIR}/backup.gpg" --encrypt --recipient-file /mnt/gpg/automation-gpg-public.asc "${WORK_DIR}/backup.tar.gz"
            rm -f "${WORK_DIR}/backup.tar.gz"

            echo "=== Uploading to S3 ==="
            aws s3api put-object \
              --bucket "{{inputs.parameters.bucket}}" \
              --key "${BUCKET_PATH}" \
              --body "${WORK_DIR}/backup.gpg" \
              --storage-class {{inputs.parameters.storageclass}} \
              --tagging "sha256=$NEW_SHA256" \
              --metadata sha256="$NEW_SHA256" \
              --output json
            echo "Upload complete."
            rm -f "${WORK_DIR}/backup.gpg" "${WORK_DIR}/backup.sha256"
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: hdd-ro-glacier
            mountPath: /mnt/hdd
            readOnly: true
          - name: gpg-automated-keys
            mountPath: /mnt/gpg/
          - name: aws-credentials-volume
            mountPath: /root/.aws/credentials
            subPath: credentials
            readOnly: true
          - name: aws-config-volume
            mountPath: /root/.aws/config
            subPath: config
            readOnly: true
      volumes:
      - name: hdd-ro-glacier
        persistentVolumeClaim:
          claimName: hdd-ro-glacier-claim
          readOnly: true
      - name: gpg-automated-keys
        secret:
          secretName: gpg-automated-keys
      - name: aws-credentials-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: credentials
              path: credentials
      - name: aws-config-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: config
              path: config

    - name: notify-approval-required
      inputs:
        parameters:
          - name: target
          - name: bucket
          - name: appname
      volumes:
      - name: hdd-ro-glacier
        persistentVolumeClaim:
          claimName: hdd-ro-glacier-claim
          readOnly: true
      container:
        image: curlimages/curl:8.7.1
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            TARGET="{{inputs.parameters.target}}"
            BUCKET="{{inputs.parameters.bucket}}"
            APPNAME="{{inputs.parameters.appname}}"
            SOURCE_SIZE=$(du -sh "$TARGET" 2>/dev/null | cut -f1 || echo "unknown")
            URL="http://ntfy.monitoring.svc.cluster.local/backup"
            MSG="Human approval required: ${TARGET} does not exist in S3 bucket ${BUCKET}, source size: ~${SOURCE_SIZE} (uncompressed). Resume the upload in Argo"
            curl -fsS -X POST \
              -H "Title: ${APPNAME} backup - approval required" \
              --data "$MSG" \
              "$URL"
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: hdd-ro-glacier
            mountPath: /mnt/hdd
            readOnly: true

    - name: ntfy-send
      inputs:
        parameters:
          - name: title
          - name: message
      container:
        image: curlimages/curl:8.7.1
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            URL="http://ntfy.monitoring.svc.cluster.local/backup"
            curl -fsS -X POST \
              -H "Title: {{inputs.parameters.title}}" \
              --data "{{inputs.parameters.message}}" \
              "$URL"


    - name: clean-workingdir
      container:
        image: debian:bullseye-slim # can be any image with bash
        command: [sh, -c]
        args:
          - |
            echo "Cleaning workingdir"
            grep '^  - /' /mnt/config/targets | sed 's/^  - //' | while read -r target; do
              rm -rf "/mnt/work${target}"
            done
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: config
            mountPath: /mnt/config
            readOnly: true

    - name: exit-handler
      dag:
        tasks:
          # - name: notify-success
          #   template: notify
          #   when: "{{workflow.status}} == Succeeded"
          #   arguments:
          #     parameters:
          #       - name: status
          #         value: "Succeeded"
          - name: notify-failure
            template: notify
            when: "{{workflow.status}} != Succeeded"
            arguments:
              parameters:
                - name: status
                  value: "Failed"
          - name: cleanup
            depends: "notify-failure.Succeeded || notify-failure.Failed || notify-failure.Skipped"
            template: clean-workingdir

    - name: notify
      inputs:
        parameters:
          - name: status
      container:
        image: curlimages/curl:8.7.1
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            URL="http://ntfy.monitoring.svc.cluster.local/backup"
            MSG="{{workflow.parameters.appname}} backup {{inputs.parameters.status}} for workflow {{workflow.name}} in ns {{workflow.namespace}}. Bucket: {{workflow.parameters.bucket}}"
            echo "Sending ntfy notification to $URL"
            curl -fsS -X POST \
              -H "Title: {{workflow.parameters.appname}} backup {{inputs.parameters.status}}" \
              --data "$MSG" \
              "$URL"
