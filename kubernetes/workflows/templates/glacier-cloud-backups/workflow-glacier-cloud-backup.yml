apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: glacier-cloud-backup
  namespace: workflows
spec:
  entrypoint: glacier-cloud-backup
  podSpecPatch: |
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - jay-c
  arguments:
    parameters:
      - name: bucket
        value: "la1r-backup-glacier-backup-data"   # default bucket name
      - name: appname
      - name: storageclass
        value: "STANDARD_IA"
  volumes:
    - name: work # working dir
      persistentVolumeClaim:
        claimName: glacier-workingdir-claim
    - name: config
      configMap:
        name: glacier-backup-targets
  onExit: exit-handler
  templates:
    - name: glacier-cloud-backup
      dag:
        tasks:
          - name: list-targets
            template: list-targets
          - name: encrypt-backup
            depends: list-targets
            template: encrypt-backup
            arguments:
              parameters:
                - name: target
                  value: "{{item}}"
            withParam: "{{tasks.list-targets.outputs.parameters.targets}}"
          - name: upload-backup
            depends: encrypt-backup
            template: upload-backup
            arguments:
              parameters:
                - name: target
                  value: "{{item}}"
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: appname
                  value: "{{workflow.parameters.appname}}"
                - name: storageclass
                  value: "{{workflow.parameters.storageclass}}"
            withParam: "{{tasks.list-targets.outputs.parameters.targets}}"

    - name: list-targets
      container:
        image: debian:bullseye-slim
        command: [sh, -c]
        args:
          - |
            apt update && apt install -y jq
            grep '^  - /' /mnt/config/targets | sed 's/^  - //' | jq -R -s 'split("\n") | map(select(length > 0))' > /tmp/targets.json
        volumeMounts:
          - name: config
            mountPath: /mnt/config
            readOnly: true
      outputs:
        parameters:
          - name: targets
            valueFrom:
              path: /tmp/targets.json

    - name: encrypt-backup
      inputs:
        parameters:
          - name: target
      container:
        image: debian:bullseye-slim # can be any image with bash
        command: [sh, -c]
        args:
          - |
            apt update && apt install -y gnupg

            TARGET="{{inputs.parameters.target}}"
            echo "=== Encrypting $TARGET ==="
            mkdir -p "/mnt/work${TARGET}"
            find "$TARGET" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > "/mnt/work${TARGET}/backup.sha256"
            tar -czf /tmp/backup.tar.gz "$TARGET"
            gpg --output "/mnt/work${TARGET}/backup.gpg" --encrypt --recipient-file /mnt/gpg/automation-gpg-public.asc /tmp/backup.tar.gz
            rm -f /tmp/backup.tar.gz
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: hdd-ro-glacier
            mountPath: /mnt/hdd
            readOnly: true
          - name: gpg-automated-keys
            mountPath: /mnt/gpg/
      volumes:
      - name: hdd-ro-glacier
        persistentVolumeClaim:
          claimName: hdd-ro-glacier-claim
          readOnly: true
      # GPG public key
      - name: gpg-automated-keys
        secret:
          secretName: gpg-automated-keys

    - name: upload-backup
      inputs:
        parameters:
          - name: bucket
          - name: appname
          - name: storageclass
          - name: target
      dag:
        tasks:
          - name: check-s3-status
            template: check-s3-status
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: appname
                  value: "{{inputs.parameters.appname}}"
          - name: notify-approval-needed
            depends: check-s3-status
            template: notify-approval-required
            when: "{{tasks.check-s3-status.outputs.parameters.needs_approval}} == true"
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: appname
                  value: "{{inputs.parameters.appname}}"
          - name: human-approval
            depends: notify-approval-needed
            template: approve-upload
            when: "{{tasks.check-s3-status.outputs.parameters.needs_approval}} == true"
          - name: compare-and-act
            depends: "check-s3-status && (human-approval.Succeeded || human-approval.Skipped)"
            template: compare-and-act
            arguments:
              parameters:
                - name: target
                  value: "{{inputs.parameters.target}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: appname
                  value: "{{inputs.parameters.appname}}"
                - name: storageclass
                  value: "{{inputs.parameters.storageclass}}"
                - name: s3_sha256
                  value: "{{tasks.check-s3-status.outputs.parameters.s3_sha256}}"
          - name: notify-bitrot
            depends: compare-and-act
            template: ntfy-send
            when: "{{tasks.compare-and-act.outputs.parameters.status}} == bitrot"
            arguments:
              parameters:
                - name: title
                  value: "{{workflow.parameters.appname}} backup - BIT ROT DETECTED"
                - name: message
                  value: "Bit rot detected! Target: {{inputs.parameters.target}}. Bucket: {{inputs.parameters.bucket}}. Local SHA256: {{tasks.compare-and-act.outputs.parameters.local_sha256}}. S3 SHA256: {{tasks.compare-and-act.outputs.parameters.s3_sha256}}."
          - name: fail-on-bitrot
            depends: notify-bitrot
            template: fail
            when: "{{tasks.compare-and-act.outputs.parameters.status}} == bitrot"

    - name: check-s3-status
      inputs:
        parameters:
          - name: target
          - name: bucket
          - name: appname
      container:
        image: amazon/aws-cli:latest
        command: [sh, -c]
        args:
          - |
            TARGET="{{inputs.parameters.target}}"
            TARGET_PATH=$(echo "$TARGET" | sed 's|^/mnt/hdd/||')
            BUCKET_PATH="${TARGET_PATH}.gpg"

            # Get existing object's sha256 tag from S3
            S3_SHA256=$(aws s3api get-object-tagging \
              --bucket "{{inputs.parameters.bucket}}" \
              --key "${BUCKET_PATH}" \
              --query "TagSet[?Key=='sha256'].Value | [0]" \
              --output text 2>/dev/null | tr -d '[:space:]')

            # AWS CLI returns "None" string when no matching tags found
            [ "$S3_SHA256" = "None" ] && S3_SHA256=""

            echo "S3 sha256: [$S3_SHA256]"

            if [ -z "$S3_SHA256" ]; then
              echo -n "true" > /tmp/needs_approval
            else
              echo -n "false" > /tmp/needs_approval
            fi

            echo -n "$S3_SHA256" > /tmp/s3_sha256
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: aws-credentials-volume
            mountPath: /root/.aws/credentials
            subPath: credentials
            readOnly: true
          - name: aws-config-volume
            mountPath: /root/.aws/config
            subPath: config
            readOnly: true
      volumes:
      - name: aws-credentials-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: credentials
              path: credentials
      - name: aws-config-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: config
              path: config
      outputs:
        parameters:
          - name: s3_sha256
            valueFrom:
              path: /tmp/s3_sha256
          - name: needs_approval
            valueFrom:
              path: /tmp/needs_approval

    - name: approve-upload
      suspend: {}

    - name: compare-and-act
      inputs:
        parameters:
          - name: target
          - name: bucket
          - name: appname
          - name: storageclass
          - name: s3_sha256
      container:
        image: amazon/aws-cli:latest
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            TARGET="{{inputs.parameters.target}}"
            TARGET_PATH=$(echo "$TARGET" | sed 's|^/mnt/hdd/||')
            BUCKET_PATH="${TARGET_PATH}.gpg"
            NEW_SHA256=$(cat "/mnt/work${TARGET}/backup.sha256" | tr -d '[:space:]')
            S3_SHA256="{{inputs.parameters.s3_sha256}}"

            echo "New SHA256:  [$NEW_SHA256]"
            echo "S3 SHA256:   [$S3_SHA256]"

            if [ -z "$S3_SHA256" ]; then
              echo "Object does not exist in S3 yet. Performing initial upload..."
              aws s3api put-object \
                --bucket "{{inputs.parameters.bucket}}" \
                --key "${BUCKET_PATH}" \
                --body "/mnt/work${TARGET}/backup.gpg" \
                --storage-class {{inputs.parameters.storageclass}} \
                --tagging "sha256=$NEW_SHA256" \
                --metadata sha256="$NEW_SHA256"
              echo "Upload complete."
              echo -n "uploaded" > /tmp/status
            elif [ "$NEW_SHA256" == "$S3_SHA256" ]; then
              echo "SHA256 matches existing S3 object. No changes detected. Skipping upload."
              echo -n "skipped" > /tmp/status
            else
              echo "=============================================="
              echo "  BIT ROT DETECTED!"
              echo "  Target: $TARGET"
              echo "  Local SHA256:  $NEW_SHA256"
              echo "  S3 SHA256:     $S3_SHA256"
              echo "  Possible hard drive corruption or data modification."
              echo "=============================================="
              echo -n "bitrot" > /tmp/status
            fi

            echo -n "$NEW_SHA256" > /tmp/local_sha256
            echo -n "$S3_SHA256" > /tmp/s3_sha256
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: aws-credentials-volume
            mountPath: /root/.aws/credentials
            subPath: credentials
            readOnly: true
          - name: aws-config-volume
            mountPath: /root/.aws/config
            subPath: config
            readOnly: true
      volumes:
      - name: aws-credentials-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: credentials
              path: credentials
      - name: aws-config-volume
        secret:
          secretName: aws-config-backup-uploader
          items:
            - key: config
              path: config
      outputs:
        parameters:
          - name: status
            valueFrom:
              path: /tmp/status
          - name: local_sha256
            valueFrom:
              path: /tmp/local_sha256
          - name: s3_sha256
            valueFrom:
              path: /tmp/s3_sha256

    - name: notify-approval-required
      inputs:
        parameters:
          - name: target
          - name: bucket
          - name: appname
      container:
        image: curlimages/curl:8.7.1
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            TARGET="{{inputs.parameters.target}}"
            BUCKET="{{inputs.parameters.bucket}}"
            APPNAME="{{inputs.parameters.appname}}"
            FILE_SIZE=$(stat -c%s "/mnt/work${TARGET}/backup.gpg" 2>/dev/null || echo "0")
            HR_SIZE=$(awk -v bytes="$FILE_SIZE" 'BEGIN {
              if (bytes == 0) { print "unknown"; exit }
              split("bytes KiB MiB GiB TiB", units)
              u = 1
              while (bytes >= 1024 && u < 5) { bytes /= 1024; u++ }
              printf "%.1f %s", bytes, units[u]
            }')
            URL="http://ntfy.monitoring.svc.cluster.local/backup"
            MSG="Human approval required: ${TARGET} does not exist in S3 bucket ${BUCKET}, size: ${HR_SIZE}. Resume the upload in Argo"
            curl -fsS -X POST \
              -H "Title: ${APPNAME} backup - approval required" \
              --data "$MSG" \
              "$URL"
        volumeMounts:
          - name: work
            mountPath: /mnt/work

    - name: ntfy-send
      inputs:
        parameters:
          - name: title
          - name: message
      container:
        image: curlimages/curl:8.7.1
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            URL="http://ntfy.monitoring.svc.cluster.local/backup"
            curl -fsS -X POST \
              -H "Title: {{inputs.parameters.title}}" \
              --data "{{inputs.parameters.message}}" \
              "$URL"

    - name: fail
      container:
        image: debian:bullseye-slim
        command: [sh, -c]
        args:
          - |
            echo "Bit rot detected. Failing workflow."
            exit 1

    - name: clean-workingdir
      container:
        image: debian:bullseye-slim # can be any image with bash
        command: [sh, -c]
        args:
          - |
            echo "Cleaning workingdir"
            grep '^  - /' /mnt/config/targets | sed 's/^  - //' | while read -r target; do
              rm -rf "/mnt/work${target}"
            done
        volumeMounts:
          - name: work
            mountPath: /mnt/work
          - name: config
            mountPath: /mnt/config
            readOnly: true

    - name: exit-handler
      dag:
        tasks:
          # - name: notify-success
          #   template: notify
          #   when: "{{workflow.status}} == Succeeded"
          #   arguments:
          #     parameters:
          #       - name: status
          #         value: "Succeeded"
          - name: notify-failure
            template: notify
            when: "{{workflow.status}} != Succeeded"
            arguments:
              parameters:
                - name: status
                  value: "Failed"
          - name: cleanup
            depends: "notify-failure.Succeeded || notify-failure.Failed || notify-failure.Skipped"
            template: clean-workingdir

    - name: notify
      inputs:
        parameters:
          - name: status
      container:
        image: curlimages/curl:8.7.1
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            URL="http://ntfy.monitoring.svc.cluster.local/backup"
            MSG="{{workflow.parameters.appname}} backup {{inputs.parameters.status}} for workflow {{workflow.name}} in ns {{workflow.namespace}}. Bucket: {{workflow.parameters.bucket}}"
            echo "Sending ntfy notification to $URL"
            curl -fsS -X POST \
              -H "Title: {{workflow.parameters.appname}} backup {{inputs.parameters.status}}" \
              --data "$MSG" \
              "$URL"
