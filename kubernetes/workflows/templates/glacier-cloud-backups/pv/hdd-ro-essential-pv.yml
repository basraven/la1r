---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: hdd-ro-glacier-pv
  labels:
    contenttype: "hdd-ro-glacier"
spec:
  capacity:
    storage: 1Gi
  storageClassName: hdd-ro-glacier
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteMany
  hostPath:
    path: "/mnt/hdd/"

  # Essential
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: la1r.workload/essential
              operator: In
              values:
                - "true"