apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: weekly-monica-cloud-backup
spec:
  schedule: "30 12 * * 0" # Every Sunday at 12:30 AM
  timezone: "Europe/Amsterdam"
  workflowSpec:
    workflowTemplateRef:
      name: essential-cloud-backup
    arguments:
      parameters:
        - name: localpath
          value: "/mnt/ssd/na/monica"
