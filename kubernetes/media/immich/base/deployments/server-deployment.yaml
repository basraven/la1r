apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  labels:
    app: immich-server
    sablier.enable: "true"
    sablier.group: immich
spec:
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v2.0.0
        ports:
        - containerPort: 2283
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-dbsecret
              key: POSTGRES_PASSWORD
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: immich-dbsecret
              key: POSTGRES_USER
        - name: DB_DATABASE_NAME
          value: immich
        - name: REDIS_PORT
          value: "6379"
        - name: IMMICH_MACHINE_LEARNING_URL
          value: "http://immich-machine-learning:3003"
        - name: UPLOAD_LOCATION
          value: "/usr/src/app/upload"
        - name: IMMICH_PORT
          value: "2283"
        # - name: IMMICH_MACHINE_LEARNING_SERVICE_HOST
        #   value: "192.168.6.182"
        volumeMounts:
        - name: immich-server-data
          mountPath: /usr/src/app/upload
        - name: immich-media-bas-data
          mountPath: /usr/src/app/external-libs/bas
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: immich-server-data
        persistentVolumeClaim:
          claimName: immich-server-data-claim
      - name: immich-media-bas-data
        persistentVolumeClaim:
          claimName: immich-media-bas-claim
      - name: immich-media-gezin-data
        persistentVolumeClaim:
          claimName: immich-media-gezin-claim
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-server
  minReplicas: 1
  maxReplicas: 1