---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: sonarr-config-pv
  labels:
    contenttype: "sonarr-config"
spec:
  capacity:
    storage: 1Gi
  storageClassName: sonarr-config-data
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: "/mnt/ssd/na/sonarr-config"
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: sonarr-torrent-data-pv
  labels:
    contenttype: "sonarr-torrent-data"
spec:
  capacity:
    storage: 10Gi
  storageClassName: sonarr-torrent-data
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: "/mnt/hdd/torrent/series"
