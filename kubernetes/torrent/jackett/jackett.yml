---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  namespace: torrent
  labels:
    app: jackett
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jackett
  template:
    metadata:
      labels:
        app: jackett
    spec:
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"
      volumes:
        - name: jackett-config-volume
          persistentVolumeClaim:
            claimName: jackett-config-claim
      containers:
      - name: jackett
        image: linuxserver/jackett
        ports:
        - name: http
          containerPort: 9117
        env:
        - name: TZ
          value: Europe/Amsterdam
        - name: PGID
          value: "1000"
        - name: PUID
          value: "1000"
        - name: DOTNET_SYSTEM_NET_DISABLEIPV6
          value: "1"
        - name: CLI_ARGS
          value: "--ListenPublic 0.0.0.0:9117"
        volumeMounts:
          - name: jackett-config-volume
            mountPath: /config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: jackett
  name: jackett
  namespace: torrent
spec:
  ports:
  - name: http
    targetPort: 9117
    port: 80
  selector:
    app: jackett
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jackett-bas
  namespace: torrent
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: jackett-bas-tls
  commonName: jackett.bas
  dnsNames:
  - jackett.bas
  - www.jackett.bas
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jackett-https
  namespace: torrent
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # traefik.ingress.kubernetes.io/router.middlewares: "torrent-sablier-jackett@kubernetescrd"
    traefik.ingress.kubernetes.io/forwarded-headers-trustedips: "10.244.0.0/16"
    traefik.ingress.kubernetes.io/preserve-host: "true"
spec:
  tls:
  - secretName: jackett-bas-tls
  rules:
  - host: jackett.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jackett
            port:
              number: 80