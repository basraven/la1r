---
# REVERSE-PROXY AUTH: Radarr needs two settings that live in /config/config.xml on
# the PVC and CANNOT be set from this manifest (linuxserver has no env var for them):
#
#   trustedNetworks = 10.244.0.0/16  -> pod CIDR. Lets Radarr trust Traefik's
#                                       X-Forwarded-For and resolve the real client IP.
#   allowedHosts    = radarr.bas,<in-cluster names>  -> host filter; the API rejects
#                                       a save when it is empty and auth isn't "Enabled".
#
# Traefik always sends X-Forwarded-For. With an empty trustedNetworks the app logs
# "Unknown proxy", discards the header, and treats EVERY request as remote -- so
# AuthenticationRequired=DisabledForLocalAddresses silently stops working and the
# UI shows a login page from the LAN. Both settings apply only after a restart.
# Fix + verification: see "Reverse-proxy authentication" in ../_index.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: torrent
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      priorityClassName: torrent-priority
      volumes:
        - name: radarr-config-volume
          persistentVolumeClaim:
            claimName: radarr-config-claim
        - name: radarr-torrent-volume
          persistentVolumeClaim:
            claimName: radarr-torrent-data-claim
        - name: radarr-torrent-ssd-volume
          persistentVolumeClaim:
            claimName: radarr-torrent-ssd-data-claim
      containers:
      - name: radarr
        resources:
        # pinned 2026-09-23: an unpinned `latest` drifted onto 6.4.4 on 2026-09-19 and
        # triggered the reverse-proxy auth prompt. Bump the tag deliberately.
        image: linuxserver/radarr:6.4.4.10685-ls318
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 7878
        env:
        - name: TZ
          value: Europe/Amsterdam
        - name: PGID
          value: "1000"
        - name: PUID
          value: "1000"
        volumeMounts:
          - name: radarr-config-volume
            mountPath: /config
          - name: radarr-torrent-volume
            mountPath: /torrent
          - name: radarr-torrent-ssd-volume
            mountPath: /torrent-ssd
       
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: radarr
  name: radarr
  namespace: torrent
spec:
  ports:
  - name: http
    targetPort: 7878
    port: 80
  selector:
    app: radarr
  type: ClusterIP

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radarr-bas
  namespace: torrent
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: radarr-bas-tls
  commonName: radarr.bas
  dnsNames:
  - radarr.bas
  - www.radarr.bas
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-https
  namespace: torrent
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  tls:
  - secretName: radarr-bas-tls
  rules:
  - host: radarr.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr
            port:
              number: 80