---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-lb-service
  namespace: torrent
spec:
  ports:
  - name: jellyfin
    port: 8096
    targetPort: 8096
  - name: http
    port: 80
    targetPort: 8096
  selector:
    app: jellyfin
  type: LoadBalancer
  loadBalancerIP: 192.168.6.61

