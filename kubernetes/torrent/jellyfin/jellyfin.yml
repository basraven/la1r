---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-bas
  namespace: torrent
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: jellyfin-bas-tls
  commonName: jellyfin.bas
  dnsNames:
  - jellyfin.bas
  - www.jellyfin.bas

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-https
  namespace: torrent
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "torrent-sablier-jellyfin@kubernetescrd"
spec:
  tls:
  - secretName: jellyfin-bas-tls
  rules:
  - host: jellyfin.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              number: 80

