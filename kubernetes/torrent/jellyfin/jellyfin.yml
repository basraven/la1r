---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: torrent
  labels:
    app: jellyfin
    sablier.enable: "false"
    sablier.group: jellyfin
spec:
  # autoscaler:
  #   enabled: true
  #   minReplicas: 0
  #   maxReplicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin
        resources:
        #   requests:
        #     memory: "1024Mi"
        #     cpu: "300m"
        #   limits:
        #     memory: "3Gi"
        #     cpu: "2000m"
        ports:
        - name: http
          containerPort: 8096
          # hostPort: 8096 # blocks scheduling
        env:
        - name: TZ
          value: "Europe//Amsterdam"
        - name: JELLYFIN_PublishedServerUrl
          value: "http://192.168.6.61:8096/"
        volumeMounts:
          - name: jellyfin-torrent-volume
            mountPath: /torrent
          - name: jellyfin-cache-volume
            mountPath: /cache
          - name: jellyfin-config-volume
            mountPath: /config
          # - name: jellyfin-transcode-volume
          #   mountPath: /transcode
      volumes:
        - name: jellyfin-torrent-volume
          persistentVolumeClaim:
            claimName: jellyfin-torrent-data-claim
        - name: jellyfin-cache-volume
          persistentVolumeClaim:
            claimName: jellyfin-cache-claim
        - name: jellyfin-config-volume
          persistentVolumeClaim:
            claimName: jellyfin-config-claim
        # - name: jellyfin-transcode-volume
        #   persistentVolumeClaim:
        #     claimName: jellyfin-transcode-claim
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: torrent
spec:
  ports:
  - name: jellyfin
    port: 8096
    targetPort: 8096
  - name: http
    port: 80
    targetPort: 8096
  selector:
    app: jellyfin
  type: ClusterIP

