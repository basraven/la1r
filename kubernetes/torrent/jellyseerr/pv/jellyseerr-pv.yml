---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: jellyseerr-config-pv
  labels:
    contenttype: "jellyseerr-config"
spec:
  capacity:
    storage: 1Gi
  storageClassName: jellyseerr-config-data
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: "/mnt/ssd/na/jellyseerr-config"
