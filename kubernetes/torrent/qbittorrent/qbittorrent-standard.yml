---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-standard
  namespace: torrent
  labels:
    app: qbittorrent-standard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent-standard
  template:
    metadata:
      labels:
        app: qbittorrent-standard
    spec:
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"
      containers:
      - name: qbitvpn
        image: dyonr/qbittorrentvpn:latest
        # command: ["/bin/sh"]
        # args: ["-c", "sleep infinity"]
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        ports:
        - name: webui
          containerPort: 8080
          protocol: TCP
        - name: tcplisten
          containerPort: 8999
          protocol: TCP
        - name: udplisten
          containerPort: 8999
          protocol: UDP
        env:
        - name: TZ
          value: Europe/Amsterdam
        - name: PGID
          value: "1000"
        - name: PUID
          value: "1000"
        - name: VPN_ENABLED
          value: "yes"
        - name: HEALTH_CHECK_INTERVAL
          value: "60"
        - name: HEALTH_CHECK_SILENT
          value: "0"
        - name: VPN_TYPE
          value: openvpn
        - name: LAN_NETWORK
          value: "192.168.0.0/16,10.244.0.0/16"
        volumeMounts:
          - name: goose-ovpn-files-volume
            mountPath: /config/openvpn
          - name: goose-loginconf-volume
            mountPath: /goose/login.conf
            subPath: login.conf
            readOnly: true
          - name: torrent-standard-data-volume
            mountPath: /config/qBittorrent
          - name: qbit-torrent-data-volume
            mountPath: /downloads
      volumes:
      - name: goose-ovpn-files-volume
        secret:
          secretName: goose-credentials
          defaultMode: 0744
          items:
          - key: ovpn1.ovpn
            path: ovpn1.ovpn
      - name: goose-loginconf-volume
        secret:
          secretName: goose-credentials
          defaultMode: 0744
          items:
          - key: login.conf
            path: login.conf
      - name: qbit-torrent-data-volume
        persistentVolumeClaim:
          claimName: qbit-torrent-data-claim
      - name: torrent-standard-data-volume
        persistentVolumeClaim:
          claimName: torrent-standard-data-claim
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-standard-service
  labels:
    app: qbittorrent-standard
  namespace: torrent
spec:
  ports:
  - name: webui
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: tcplisten
    port: 8999
    targetPort: 8999
    protocol: TCP
  - name: udplisten
    port: 8999
    targetPort: 8999
    protocol: UDP
  selector:
    app: qbittorrent-standard


---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qbittorrent-standard-bas
  namespace: torrent
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: qbittorrent-standard-bas-tls
  commonName: torrent.bas
  dnsNames:
  - torrent.bas
  - www.torrent.bas
  ipAddresses:
  - 192.168.6.2


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-standard-https
  namespace: torrent
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # traefik.ingress.kubernetes.io/router.middlewares: "torrent-sablier-qbittorrent@kubernetescrd"
spec:
  tls:
  - secretName: qbittorrent-standard-bas-tls
  rules:
  - host: torrent.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qbittorrent-standard-service
            port:
              number: 80
