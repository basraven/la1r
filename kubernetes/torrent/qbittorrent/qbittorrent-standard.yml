---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-standard
  namespace: torrent
  labels:
    app: qbittorrent-standard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent-standard
  template:
    metadata:
      labels:
        app: qbittorrent-standard
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 8.8.8.8
        - 8.8.4.4
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"
      initContainers:
      - name: config-cycler
        image: alpine:latest
        command:
          - /bin/sh
          - -c
          - |
            set -e
            mkdir -p /data/openvpn-ovpn-state
            mkdir -p /data/vpn_state
            STATE_FILE="/data/vpn_state/last_index.txt"

            if ! ls /config/openvpn-all/*.ovpn >/dev/null 2>&1; then
              echo "No .ovpn files found in /config/openvpn-all"
              exit 1
            fi

            FILES=$(ls -1 /config/openvpn-all/*.ovpn)
            FILE_COUNT=$(printf "%s\n" $FILES | wc -l)
            if [ -f "$STATE_FILE" ]; then
              LAST_INDEX=$(cat "$STATE_FILE" 2>/dev/null || echo -1)
            else
              LAST_INDEX=-1
            fi
            START_INDEX=$(( (LAST_INDEX + 1) % FILE_COUNT ))
            echo "Starting selection from index: $START_INDEX (last=$LAST_INDEX, count=$FILE_COUNT)"
            SELECTED_FILE=""
            SELECTED_INDEX="$START_INDEX"
            i=0
            while [ "$i" -lt "$FILE_COUNT" ]; do
              IDX=$(( (START_INDEX + i) % FILE_COUNT ))
              CANDIDATE=$(printf "%s\n" $FILES | sed -n "$((IDX + 1))p")
              REMOTE_HOST=$(awk '/^remote[[:space:]]+/{print $2; exit}' "$CANDIDATE" 2>/dev/null || true)
              if [ -n "$REMOTE_HOST" ] && getent hosts "$REMOTE_HOST" >/dev/null 2>&1; then
                SELECTED_FILE="$CANDIDATE"
                SELECTED_INDEX="$IDX"
                echo "Candidate $(basename "$CANDIDATE") resolves ($REMOTE_HOST) — selecting"
                break
              else
                echo "Candidate $(basename "$CANDIDATE") does not resolve ($REMOTE_HOST) — skipping"
              fi
              i=$((i+1))
            done
            if [ -z "$SELECTED_FILE" ]; then
              # Fallback to next file even if resolution fails
              SELECTED_FILE=$(printf "%s\n" $FILES | sed -n "$((START_INDEX + 1))p")
              SELECTED_INDEX="$START_INDEX"
              echo "No resolvable candidate found; falling back to $(basename "$SELECTED_FILE")"
            fi
            rm -f /data/openvpn-ovpn-state/*.ovpn || true
            cp "$SELECTED_FILE" /data/openvpn-ovpn-state/
            echo "$SELECTED_INDEX" > "$STATE_FILE"
            echo "Selected VPN config: $(basename "$SELECTED_FILE") (index=$SELECTED_INDEX)"
        volumeMounts:
        - name: goose-ovpn-files-volume
          mountPath: /config/openvpn-all
          readOnly: true
        - name: torrent-standard-data-volume
          mountPath: /data
      containers:
      - name: qbitvpn
        image: dyonr/qbittorrentvpn:latest
        # command: ["/bin/sh"]
        # args: ["-c", "sleep infinity"]
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # Fail fast on any unhandled error in this script
              set -e
              rotate_ovpn_if_needed() {
                STATE_DIR="/data/vpn_state"
                STATE_FILE="$STATE_DIR/last_index.txt"
                mkdir -p "$STATE_DIR"
                # Only rotate when there are multiple configs
                if ! ls /config/openvpn-all/*.ovpn >/dev/null 2>&1; then
                  return 0
                fi
                FILE_COUNT=$(ls -1 /config/openvpn-all/*.ovpn | wc -l | tr -d ' ')
                if [ "$FILE_COUNT" -le 1 ]; then
                  return 0
                fi
                # Determine current and next index
                CUR_FILE=$(ls -1 /config/openvpn/*.ovpn 2>/dev/null | head -n1 || true)
                CUR_INDEX=-1
                if [ -n "$CUR_FILE" ]; then
                  CUR_BASE=$(basename "$CUR_FILE")
                  i=0
                  for f in /config/openvpn-all/*.ovpn; do
                    if [ "$(basename "$f")" = "$CUR_BASE" ]; then CUR_INDEX=$i; break; fi
                    i=$((i+1))
                  done
                fi
                if [ "$CUR_INDEX" -lt 0 ] && [ -f "$STATE_FILE" ]; then
                  CUR_INDEX=$(cat "$STATE_FILE" 2>/dev/null || echo -1)
                fi
                NEXT_INDEX=$(( (CUR_INDEX + 1) % FILE_COUNT ))
                NEXT_FILE=$(ls -1 /config/openvpn-all/*.ovpn | sed -n "$((NEXT_INDEX + 1))p")
                # Swap active config
                rm -f /config/openvpn/*.ovpn || true
                cp "$NEXT_FILE" /config/openvpn/
                echo "$NEXT_INDEX" > "$STATE_FILE"
                echo "Rotated VPN config to: $(basename "$NEXT_FILE")"
              }
              # If VPN interface is not yet up, check for persistent DNS failures for the OpenVPN remote
              if ! ip -o -4 addr show dev tun0 | grep -q "inet "; then
                # Read active .ovpn file selected by initContainer (mounted under /config/openvpn)
                OVPN_FILE="$(ls -1 /config/openvpn/*.ovpn 2>/dev/null | head -n1 || true)"
                # Extract the remote host from 'remote <host> <port>'
                REMOTE_HOST=""
                [ -n "$OVPN_FILE" ] && REMOTE_HOST="$(awk '/^remote[[:space:]]+/{print $2; exit}' "$OVPN_FILE" 2>/dev/null || true)"
                # Track consecutive DNS resolution failures in a temp counter
                DNS_COUNT_FILE="/data/vpn_state/openvpn_dns_fail_count"
                mkdir -p "$(dirname "$DNS_COUNT_FILE")"
                if [ -n "$REMOTE_HOST" ]; then
                  # getent uses glibc NSS; returns non-zero when name cannot be resolved
                  if ! getent hosts "$REMOTE_HOST" >/dev/null 2>&1; then
                    DNS_COUNT=0
                    [ -f "$DNS_COUNT_FILE" ] && DNS_COUNT="$(cat "$DNS_COUNT_FILE" || echo 0)"
                    DNS_COUNT=$((DNS_COUNT+1))
                    echo "$DNS_COUNT" > "$DNS_COUNT_FILE"
                    # If DNS fails 6 times (≈60s with periodSeconds:10), let the probe fail to restart the pod
                    if [ "$DNS_COUNT" -ge 6 ]; then
                      rotate_ovpn_if_needed
                      exit 1
                    fi
                  else
                    # Reset counter once DNS resolves successfully
                    echo "0" > "$DNS_COUNT_FILE" || true
                  fi
                fi
                # Track general tun0 bring-up failures to rotate even if DNS is fine
                TUN_COUNT_FILE="/data/vpn_state/openvpn_tun_fail_count"
                mkdir -p "$(dirname "$TUN_COUNT_FILE")"
                TUN_COUNT=0
                [ -f "$TUN_COUNT_FILE" ] && TUN_COUNT="$(cat "$TUN_COUNT_FILE" || echo 0)"
                TUN_COUNT=$((TUN_COUNT+1))
                echo "$TUN_COUNT" > "$TUN_COUNT_FILE"
                if [ "$TUN_COUNT" -ge 6 ]; then
                  rotate_ovpn_if_needed
                  # reset counter so next round counts anew
                  echo "0" > "$TUN_COUNT_FILE" || true
                fi
              fi
              # Original checks (relaxed for startup): require tun0 IPv4 to be present
              ip -o -4 addr show dev tun0 | grep -q "inet "
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # Fail fast on any unhandled error in this script
              set -e
              rotate_ovpn_if_needed() {
                STATE_DIR="/data/vpn_state"
                STATE_FILE="$STATE_DIR/last_index.txt"
                mkdir -p "$STATE_DIR"
                if ! ls /config/openvpn-all/*.ovpn >/dev/null 2>&1; then
                  return 0
                fi
                FILE_COUNT=$(ls -1 /config/openvpn-all/*.ovpn | wc -l | tr -d ' ')
                if [ "$FILE_COUNT" -le 1 ]; then
                  return 0
                fi
                CUR_FILE=$(ls -1 /config/openvpn/*.ovpn 2>/dev/null | head -n1 || true)
                CUR_INDEX=-1
                if [ -n "$CUR_FILE" ]; then
                  CUR_BASE=$(basename "$CUR_FILE")
                  i=0
                  for f in /config/openvpn-all/*.ovpn; do
                    if [ "$(basename "$f")" = "$CUR_BASE" ]; then CUR_INDEX=$i; break; fi
                    i=$((i+1))
                  done
                fi
                if [ "$CUR_INDEX" -lt 0 ] && [ -f "$STATE_FILE" ]; then
                  CUR_INDEX=$(cat "$STATE_FILE" 2>/dev/null || echo -1)
                fi
                NEXT_INDEX=$(( (CUR_INDEX + 1) % FILE_COUNT ))
                NEXT_FILE=$(ls -1 /config/openvpn-all/*.ovpn | sed -n "$((NEXT_INDEX + 1))p")
                rm -f /config/openvpn/*.ovpn || true
                cp "$NEXT_FILE" /config/openvpn/
                echo "$NEXT_INDEX" > "$STATE_FILE"
                echo "Rotated VPN config to: $(basename "$NEXT_FILE")"
              }
              # If VPN interface is not up, detect persistent DNS failures to trigger restart
              if ! ip -o -4 addr show dev tun0 | grep -q "inet "; then
                # Read active .ovpn and extract remote host
                OVPN_FILE="$(ls -1 /config/openvpn/*.ovpn 2>/dev/null | head -n1 || true)"
                REMOTE_HOST=""
                [ -n "$OVPN_FILE" ] && REMOTE_HOST="$(awk '/^remote[[:space:]]+/{print $2; exit}' "$OVPN_FILE" 2>/dev/null || true)"
                DNS_COUNT_FILE="/data/vpn_state/openvpn_dns_fail_count"
                mkdir -p "$(dirname "$DNS_COUNT_FILE")"
                if [ -n "$REMOTE_HOST" ]; then
                  if ! getent hosts "$REMOTE_HOST" >/dev/null 2>&1; then
                    DNS_COUNT=0
                    [ -f "$DNS_COUNT_FILE" ] && DNS_COUNT="$(cat "$DNS_COUNT_FILE" || echo 0)"
                    DNS_COUNT=$((DNS_COUNT+1))
                    echo "$DNS_COUNT" > "$DNS_COUNT_FILE"
                    # Threshold aligns with startup probe for consistency
                    if [ "$DNS_COUNT" -ge 6 ]; then
                      rotate_ovpn_if_needed
                      exit 1
                    fi
                  else
                    # Reset counter on success
                    echo "0" > "$DNS_COUNT_FILE" || true
                  fi
                fi
              fi
              # Original checks: VPN must be up and HTTP UI must answer 2xx/3xx on :8080
              # Relaxed for liveness: require tun0 IPv4; route via tun0 not enforced here
              HEALTH_FAIL_FILE="/data/vpn_state/openvpn_health_fail_count"
              mkdir -p "$(dirname "$HEALTH_FAIL_FILE")"
              if ip -o -4 addr show dev tun0 | grep -q "inet "; then
                if bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1; printf "GET / HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n 1 <&3 | grep -qE "HTTP/1\\.[01] [23][0-9]{2}"'; then
                  echo "0" > "$HEALTH_FAIL_FILE" || true
                  exit 0
                else
                  FAILS=0; [ -f "$HEALTH_FAIL_FILE" ] && FAILS="$(cat "$HEALTH_FAIL_FILE" || echo 0)"; FAILS=$((FAILS+1)); echo "$FAILS" > "$HEALTH_FAIL_FILE"
                  if [ "$FAILS" -ge 6 ]; then
                    rotate_ovpn_if_needed; exit 1
                  else
                    exit 1
                  fi
                fi
              else
                FAILS=0; [ -f "$HEALTH_FAIL_FILE" ] && FAILS="$(cat "$HEALTH_FAIL_FILE" || echo 0)"; FAILS=$((FAILS+1)); echo "$FAILS" > "$HEALTH_FAIL_FILE"
                if [ "$FAILS" -ge 6 ]; then
                  rotate_ovpn_if_needed; exit 1
                else
                  exit 1
                fi
              fi
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # Ready when WebUI is accepting TCP connections on 8080
              bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "4"
            memory: "6Gi"
          requests:
            cpu: "2"
            memory: "3Gi"
        ports:
        - name: webui
          containerPort: 8080
          protocol: TCP
        - name: tcplisten
          containerPort: 8999
          protocol: TCP
        - name: udplisten
          containerPort: 8999
          protocol: UDP
        env:
        - name: TZ
          value: Europe/Amsterdam
        - name: PGID
          value: "1000"
        - name: PUID
          value: "1000"
        - name: VPN_ENABLED
          value: "yes"
        - name: HEALTH_CHECK_INTERVAL
          value: "60"
        - name: HEALTH_CHECK_SILENT
          value: "0"
        - name: VPN_TYPE
          value: openvpn
        - name: LAN_NETWORK
          value: "192.168.0.0/16,10.244.0.0/16,10.96.0.0/12"
        - name: NAME_SERVERS
          value: "10.96.0.10,1.1.1.1,1.0.0.1"
        volumeMounts:
          - name: goose-ovpn-files-volume
            mountPath: /config/openvpn-all
          - name: goose-loginconf-volume
            mountPath: /goose/login.conf
            subPath: login.conf
            readOnly: true
          - name: torrent-standard-data-volume
            mountPath: /config/qBittorrent
            subPath: qBittorrent
          - name: torrent-standard-data-volume
            mountPath: /config/openvpn
            subPath: openvpn-ovpn-state
          - name: torrent-standard-data-volume
            mountPath: /data/vpn_state
            subPath: vpn_state
          - name: qbit-torrent-data-volume
            mountPath: /torrent
          - name: qbit-torrent-ssd-data-volume
            mountPath: /torrent-ssd
      volumes:
      - name: goose-ovpn-files-volume
        secret:
          secretName: goose-credentials
          defaultMode: 0744
          # items:
          # - key: ovpn1.ovpn
          #   path: ovpn1.ovpn
      - name: goose-loginconf-volume
        secret:
          secretName: goose-credentials
          defaultMode: 0744
          items:
          - key: login.conf
            path: login.conf
      - name: qbit-torrent-data-volume
        persistentVolumeClaim:
          claimName: qbit-torrent-data-claim
      - name: qbit-torrent-ssd-data-volume
        persistentVolumeClaim:
          claimName: qbit-torrent-ssd-data-claim
      - name: torrent-standard-data-volume
        persistentVolumeClaim:
          claimName: torrent-standard-data-claim
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-standard-service
  labels:
    app: qbittorrent-standard
  namespace: torrent
spec:
  ports:
  - name: webui
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: tcplisten
    port: 8999
    targetPort: 8999
    protocol: TCP
  - name: udplisten
    port: 8999
    targetPort: 8999
    protocol: UDP
  selector:
    app: qbittorrent-standard


---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qbittorrent-standard-bas
  namespace: torrent
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: qbittorrent-standard-bas-tls
  commonName: torrent.bas
  dnsNames:
  - torrent.bas
  - www.torrent.bas
  ipAddresses:
  - 192.168.6.2


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-standard-https
  namespace: torrent
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # traefik.ingress.kubernetes.io/router.middlewares: "torrent-sablier-qbittorrent@kubernetescrd"
spec:
  tls:
  - secretName: qbittorrent-standard-bas-tls
  rules:
  - host: torrent.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qbittorrent-standard-service
            port:
              number: 80
