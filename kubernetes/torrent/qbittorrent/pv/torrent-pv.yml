---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: torrent-standard-data-pv
  labels:
    contenttype: "torrent-standard-data"
spec:
  capacity:
    storage: 1Gi
  storageClassName: torrent-standard-data
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: "/mnt/ssd/na/torrent/state/standard"
