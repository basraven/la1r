---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: qbit-torrent-data-pv
  labels:
    contenttype: "qbit-torrent-data"
spec:
  capacity:
    storage: 2000Gi
  storageClassName: qbit-torrent-data
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteMany
  hostPath:
    path: "/mnt/hdd/torrent" # path to directory
