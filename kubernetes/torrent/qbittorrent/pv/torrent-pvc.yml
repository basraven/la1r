---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torrent-config-claim
  namespace: torrent
spec:
  storageClassName: torrent-config
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-torrent-data-claim
  namespace: torrent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: qbit-torrent-data
  selector:
    matchLabels:
      contenttype: "qbit-torrent-data"
  resources:
    requests:
      storage: 2000Gi
      