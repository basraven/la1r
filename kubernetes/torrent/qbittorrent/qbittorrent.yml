---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrent
  labels:
    app: qbittorrent
    sablier.enable: "true"
    sablier.group: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"
      # hostNetwork: true
      volumes:
      - name: torrent-config-volume
        persistentVolumeClaim:
          claimName: torrent-config-claim
      - name: qbit-torrent-data-volume
        persistentVolumeClaim:
          claimName: qbit-torrent-data-claim
      containers:
      - name: qbitvpn
        resources: 
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        image: dyonr/qbittorrentvpn:latest
        
        # image: ubuntu:latest
        # sleep infinity commmand
        # command: ["/bin/sh"]
        # args: ["-c", "sleep infinity"]


        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
        ports:
        - name: webui
          containerPort: 8080
          protocol: TCP
        - name: tcplisten
          containerPort: 8999
          protocol: TCP
        - name: udplisten
          containerPort: 8999
          protocol: UDP
        env:
        - name: TZ
          value: Europe/Amsterdam
        - name: PGID
          value: "1000"
        - name: PUID
          value: "1000"
        - name: VPN_ENABLED
          value: yes
        - name: VPN_TYPE
          value: openvpn
        - name: LAN_NETWORK
          value: "192.168.0.0/16,10.244.0.0/16"
        volumeMounts:
          - name: torrent-config-volume
            mountPath: /config
          - name: qbit-torrent-data-volume
            mountPath: /downloads
        
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-lb-service
  namespace: torrent
spec:
  ports:
  - name: webui
    port: 8086
    targetPort: 8080
    protocol: TCP
  - name: tcplisten
    port: 8999
    targetPort: 8999
    protocol: TCP
  - name: udplisten
    port: 8999
    targetPort: 8999
    protocol: UDP
  selector:
    app: qbittorrent
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.6.61


