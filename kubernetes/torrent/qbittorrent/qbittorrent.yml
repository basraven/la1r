---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrent
  labels:
    app: qbittorrent
    # sablier.enable: "true"
    # sablier.group: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"
      # hostNetwork: true
      volumes:
      - name: goose-ovpn-files-volume
        secret:
          secretName: goose-ovpn-files
          defaultMode: 0744
          items:
          - key: qbitorrent.ovpn
            path: qbitorrent.ovpn
      - name: goose-loginconf-volume
        secret:
          secretName: goose-loginconf
          defaultMode: 0744
      - name: qbit-torrent-data-volume
        persistentVolumeClaim:
          claimName: qbit-torrent-data-claim
      - name: torrent-config-volume
        persistentVolumeClaim:
          claimName: torrent-config-claim
      - name: qbittorent-openvpn-start-volume
        configMap:
          name: qbittorrent-openvpn-start
          defaultMode: 0744
      containers:
      - name: qbitvpn
        # resources: 
        #   requests:
        #     memory: "128Mi"
        #     cpu: "50m"
        #   limits:
        #     memory: "1Gi"
        #     cpu: "500m"
        image: dyonr/qbittorrentvpn:latest
        
        # image: ubuntu:latest
        # sleep infinity commmand
        # command: ["/bin/sh"]
        # args: ["-c", "sleep infinity"]


        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
        # livenessProbe:
        #   httpGet:
        #     path: /
        #     port: 8080
        #   initialDelaySeconds: 60
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        #   failureThreshold: 3
        ports:
        - name: webui
          containerPort: 8080
          protocol: TCP
        - name: tcplisten
          containerPort: 8999
          protocol: TCP
        - name: udplisten
          containerPort: 8999
          protocol: UDP
        env:
        - name: TZ
          value: Europe/Amsterdam
        - name: PGID
          value: "1000"
        - name: PUID
          value: "1000"
        - name: VPN_ENABLED
          value: yes
        - name: HEALTH_CHECK_INTERVAL
          value: "60"
        - name: HEALTH_CHECK_SILENT
          value: "0"
        - name: VPN_TYPE
          value: openvpn
        - name: LAN_NETWORK
          value: "192.168.0.0/16,10.244.0.0/16"
        volumeMounts:
          - name: goose-ovpn-files-volume
            mountPath: /config/openvpn
          - name: goose-loginconf-volume
            mountPath: /config/login.conf
            subPath: login.conf
            readOnly: true
          - name: torrent-config-volume
            mountPath: /config/qBittorrent
          - name: qbit-torrent-data-volume
            mountPath: /downloads
          - name: qbittorent-openvpn-start-volume
            mountPath: /etc/openvpn/start.sh
            subPath: start.sh
        
