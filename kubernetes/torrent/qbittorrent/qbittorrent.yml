---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: qbittorrent
  name: qbittorrent-service
  namespace: torrent
spec:
  ports:
  - name: webui
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: tcplisten
    port: 8999
    targetPort: 8999
    protocol: TCP
  - name: udplisten
    port: 8999
    targetPort: 8999
    protocol: UDP
  selector:
    app: qbittorrent


---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qbittorrent-bas
  namespace: torrent
spec:
  issuerRef:
    name: la1r
    kind: ClusterIssuer
  secretName: qbittorrent-bas-tls
  commonName: torrent.bas
  dnsNames:
  - torrent.bas
  - www.torrent.bas
  ipAddresses:
  - 192.168.6.2


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-https
  namespace: torrent
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # traefik.ingress.kubernetes.io/router.middlewares: "torrent-sablier-qbittorrent@kubernetescrd"
spec:
  tls:
  - secretName: qbittorrent-bas-tls
  rules:
  - host: torrent.bas
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qbittorrent-service
            port:
              number: 80
