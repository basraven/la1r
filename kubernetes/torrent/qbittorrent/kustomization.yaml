apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: torrent
resources:
- pv
- middleware.yml
- qbittorrent-standard.yml
- qbittorrent-series.yml
- qbittorrent-uhd.yml

# configmap based on config/start.sh
configMapGenerator:
- name: qbittorrent-openvpn-start
  files:
  - config/start.sh
generatorOptions:
  disableNameSuffixHash: true