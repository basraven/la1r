apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ceryx
  namespace: flux-system
spec:
  interval: 2m0s
  url: ssh://git@github.com/basraven/ceryx
  ref:
    branch: master
  secretRef:
    name: flux-pgp-secret

# Seb: Run this first:
# flux create secret git flux-pgp-secret \
#     --url=ssh://git@github.com/basraven/la1r-cred \
#     --private-key-file=./id_rsa
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ceryx
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: ceryx