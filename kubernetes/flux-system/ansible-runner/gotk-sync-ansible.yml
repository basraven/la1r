---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ansible-runner
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./cicd/ansible-new
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  postBuild:
    substitute:
      COMMIT_HASH: "${GIT_COMMIT_HASH}"