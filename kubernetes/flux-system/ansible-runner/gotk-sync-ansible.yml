apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ansible-only
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/basraven/la1r.git
  ref:
    branch: rick
  ignore: |
    /*
    !/cicd/ansible/
    !/kubernetes/flux-system/ansible-runner/job
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ansible-job
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./kubernetes/flux-system/ansible-runner/job
  sourceRef:
    kind: GitRepository
    name: ansible-only
  prune: true
  postBuild:
    substitute:
      COMMIT_HASH: "${GIT_COMMIT_HASH}"