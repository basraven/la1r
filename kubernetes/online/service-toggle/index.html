<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Toggle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    justify-content: center;
    padding: 1rem;
    min-height: 100vh;
  }
  .container {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 360px;
  }
  .card {
    background: #16213e;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }
  .service-name {
    font-size: 1rem;
    font-weight: 600;
    color: #c0c0d0;
  }
  .service-ns {
    font-size: 0.7rem;
    color: #555;
    margin-top: 1px;
  }
  .status-tag {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .dot.offline { background: #f87171; box-shadow: 0 0 8px #f87171; }
  .dot.timed { background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }
  .dot.error { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
  .dot.loading { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-tag.online { color: #4ade80; }
  .status-tag.offline { color: #f87171; }
  .status-tag.timed { color: #60a5fa; }
  .status-tag.error { color: #fbbf24; }
  .countdown {
    text-align: center;
    padding: 0.3rem 0 0.2rem;
  }
  .uptime {
    font-size: 0.8rem;
    color: #4ade80;
    font-weight: 500;
  }
  .timer {
    font-size: 1.6rem;
    font-weight: 700;
    color: #60a5fa;
    font-variant-numeric: tabular-nums;
  }
  .timer-row {
    display: flex;
    gap: 0.35rem;
    justify-content: center;
    padding: 0.25rem 0;
  }
  .timer-btn {
    flex: 1;
    max-width: 80px;
    padding: 0.35rem 0;
    font-size: 0.8rem;
    font-weight: 600;
    border: 1.5px solid;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
    text-align: center;
  }
  .timer-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .timer-btn.add {
    border-color: #60a5fa;
    color: #60a5fa;
  }
  .timer-btn.add:hover:not(:disabled) {
    background: #60a5fa;
    color: #1a1a2e;
  }
  .timer-btn.sub {
    border-color: #f87171;
    color: #f87171;
  }
  .timer-btn.sub:hover:not(:disabled) {
    background: #f87171;
    color: #1a1a2e;
  }
  .main-btn {
    display: block;
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.35rem;
    font-size: 0.85rem;
    font-weight: 600;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.1s;
    text-align: center;
  }
  .main-btn:active { transform: scale(0.98); }
  .main-btn.stop { background: #f87171; }
  .main-btn.start { background: #4ade80; color: #1a1a2e; }
  .main-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .error-msg {
    color: #f87171;
    font-size: 0.8rem;
    display: none;
    text-align: center;
    margin-top: 0.4rem;
  }

  /* Lucky button */
  .lucky-btn {
    display: block;
    width: 100%;
    padding: 0.4rem 0;
    font-size: 0.8rem;
    font-weight: 700;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    background: linear-gradient(135deg, #f093fb, #f5576c, #ffd452);
    color: #fff;
    transition: transform 0.15s, box-shadow 0.15s;
    text-align: center;
    letter-spacing: 0.3px;
    box-shadow: 0 2px 12px rgba(245,87,108,0.4);
  }
  .lucky-btn:hover:not(:disabled) {
    transform: scale(1.02);
    box-shadow: 0 4px 20px rgba(245,87,108,0.6);
  }
  .lucky-btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .lucky-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Lucky modal overlay */
  .lucky-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    animation: fade-in 0.3s ease;
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .lucky-modal {
    position: relative;
    background: #1a1a2e;
    border-radius: 20px;
    padding: 1.5rem;
    max-width: 340px;
    width: 90%;
    text-align: center;
    box-shadow: 0 10px 60px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
    animation: modal-pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes modal-pop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .lucky-modal h2 {
    font-size: 1.1rem;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, #f093fb, #f5576c, #ffd452);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .lucky-modal .subtitle {
    font-size: 0.7rem;
    color: #666;
    margin-bottom: 0.75rem;
  }
  .close-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.75rem;
    background: none;
    border: none;
    color: #555;
    font-size: 1.3rem;
    cursor: pointer;
    transition: color 0.15s;
    line-height: 1;
    padding: 0.2rem;
    z-index: 10;
  }
  .close-btn:hover { color: #fff; }

  /* Wheel */
  .wheel-wrapper {
    position: relative;
    display: inline-block;
    margin: 0 auto;
  }
  .wheel-pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 22px solid #FFD700;
    filter: drop-shadow(0 2px 6px rgba(255,215,0,0.6));
  }
  .wheel-pointer::after {
    content: "";
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,215,0,0.8);
  }
  #lucky-canvas {
    display: block;
    margin: 0 auto;
    max-width: 280px;
    height: auto;
  }

  /* Spin button */
  .spin-btn {
    display: block;
    width: 100%;
    padding: 0.6rem;
    margin-top: 0.75rem;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(102,126,234,0.5);
  }
  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Result display */
  .lucky-result {
    display: none;
    margin-top: 0.75rem;
    animation: result-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4);
  }
  @keyframes result-pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-emoji {
    font-size: 2.5rem;
    margin-bottom: 0.2rem;
  }
  .result-value {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #f093fb, #f5576c, #ffd452);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-label {
    font-size: 0.85rem;
    color: #aaa;
    margin-top: 0.25rem;
    font-style: italic;
  }

  /* Apply button */
  .apply-btn {
    display: none;
    width: 100%;
    padding: 0.6rem;
    margin-top: 0.75rem;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #4ade80, #34d399);
    color: #1a1a2e;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .apply-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(74,222,128,0.5);
  }

  /* Confetti */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1001;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    top: -10px;
    animation: confetti-fall linear forwards;
    opacity: 0.9;
  }
  @keyframes confetti-fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>
<div class="container" id="container"></div>

<div class="lucky-overlay" id="lucky-modal">
  <div class="lucky-modal">
    <button class="close-btn" onclick="closeLucky()">&times;</button>
    <h2>&#127811; Wheel of Misfortune</h2>
    <p class="subtitle">Spin to see what the universe wants from your timer!</p>
    <div class="wheel-wrapper">
      <div class="wheel-pointer"></div>
      <canvas id="lucky-canvas" width="300" height="300"></canvas>
    </div>
    <button class="spin-btn" id="spin-btn" onclick="spinWheel()">&#127984; SPIN!</button>
    <div class="lucky-result" id="lucky-result"></div>
    <button class="apply-btn" id="lucky-apply-btn">&#10003; Apply!</button>
  </div>
</div>

<div class="confetti-container" id="confetti-container"></div>

<script>
var container = document.getElementById("container");

// Extract token from URL query param, store in session for API calls
var AUTH_TOKEN = (function() {
  var t = new URLSearchParams(window.location.search).get("token");
  if (t) {
    sessionStorage.setItem("st_token", t);
  }
  return t || "";
})();

function authFetch(url, opts) {
  opts = opts || {};
  if (AUTH_TOKEN) {
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + AUTH_TOKEN;
  }
  return fetch(url, opts);
}

function fmt(seconds) {
  var h = Math.floor(seconds / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  var s = seconds % 60;
  if (h > 0) return h + "h " + m + "m " + s + "s";
  if (m > 0) return m + "m " + s + "s";
  return s + "s";
}

function cardHTML(dep) {
  var id = dep.namespace + "-" + dep.name;
  return (
    '<div class="card" id="card-' + id + '">' +
      '<div class="card-header">' +
        '<div>' +
          '<div class="service-name">' + dep.name + '</div>' +
          '<div class="service-ns">' + dep.namespace + '</div>' +
        '</div>' +
        '<div class="status-tag" id="tag-' + id + '">' +
          '<span class="dot loading" id="dot-' + id + '"></span>' +
          '<span id="label-' + id + '">...</span>' +
        '</div>' +
      '</div>' +
      '<div class="countdown">' +
        '<div class="uptime" id="up-' + id + '"></div>' +
        '<div class="timer" id="cd-' + id + '"></div>' +
      '</div>' +
      '<div class="timer-row" id="ar-' + id + '"></div>' +
      '<div class="timer-row" id="lr-' + id + '"></div>' +
      '<div class="timer-row" id="sr-' + id + '"></div>' +
      '<button class="main-btn" id="btn-' + id + '" disabled>...</button>' +
      '<div class="error-msg" id="err-' + id + '"></div>' +
    '</div>'
  );
}

function buildRow(containerId, opts, prefix, cls, ns, name) {
  var row = document.getElementById(containerId);
  if (!row) return;
  row.innerHTML = "";
  (opts || [1, 2, 4]).forEach(function(h) {
    var b = document.createElement("button");
    b.className = "timer-btn " + cls;
    b.textContent = prefix + h + "h";
    b.onclick = function() { toggle(ns, name, h * (prefix === "−" ? -1 : 1)); };
    row.appendChild(b);
  });
}

function build(dep) {
  var id = dep.namespace + "-" + dep.name;
  var addRow = document.getElementById("ar-" + id);
  var subRow = document.getElementById("sr-" + id);
  if (!addRow) return;
  addRow.innerHTML = "";
  subRow.innerHTML = "";
  subRow.style.display = "none";

  // Lucky row
  var luckyRow = document.getElementById("lr-" + id);
  if (luckyRow) {
    luckyRow.innerHTML = "";
    luckyRow.style.display = "none";
  }

  if (dep.mode === "timed") {
    var opts = dep.options || [1, 2, 4];
    buildRow("ar-" + id, opts, "+", "add", dep.namespace, dep.name);
    if (dep.status === "online") {
      subRow.style.display = "";
      buildRow("sr-" + id, opts, "−", "sub", dep.namespace, dep.name);
    }
    // Show lucky button
    if (luckyRow) {
      luckyRow.style.display = "";
      var lb = document.createElement("button");
      lb.className = "lucky-btn";
      lb.textContent = "🍀 I'm Feeling Lucky";
      lb.onclick = function() { openLucky(dep.namespace, dep.name); };
      luckyRow.appendChild(lb);
    }
  }
}

function setUI(dep) {
  var id = dep.namespace + "-" + dep.name;
  var dot = document.getElementById("dot-" + id);
  var label = document.getElementById("label-" + id);
  var cd = document.getElementById("cd-" + id);
  var btn = document.getElementById("btn-" + id);
  var err = document.getElementById("err-" + id);

  // Clear old interval
  if (window["intv_" + id]) { clearInterval(window["intv_" + id]); delete window["intv_" + id]; }

  dot.className = "dot " + dep.status;
  label.textContent = dep.error ? "ERROR" : dep.status;
  document.getElementById("tag-" + id).className = "status-tag " + dep.status;

  err.textContent = dep.error || "";
  err.style.display = dep.error ? "block" : "none";

  build(dep);

  if (dep.mode === "timed" && dep.status !== "online") {
    btn.style.display = "none";
  } else {
    btn.style.display = "block";
    btn.textContent = dep.status === "online" ? "Stop" : "Start";
    btn.className = "main-btn " + (dep.status === "online" ? "stop" : "start");
    btn.onclick = function() { toggle(dep.namespace, dep.name); };
  }
  btn.disabled = false;

  var upEl = document.getElementById("up-" + id);
  if (!upEl) return;

  var isOnline = dep.status === "online";

  // Uptime display (snapshot from API, then count locally)
  if (isOnline && dep.uptime_seconds > 0) {
    upEl.textContent = "Running for " + fmt(dep.uptime_seconds);
  } else {
    upEl.textContent = "";
  }

  // Timer countdown display
  if (dep.remaining_seconds > 0) {
    cd.textContent = "Auto-stops in " + fmt(dep.remaining_seconds);
  } else {
    cd.textContent = "";
  }

  // Live tick: always runs when online (uptime) or when timer active
  var needsTick = isOnline || dep.remaining_seconds > 0;
  if (needsTick) {
    window["intv_" + id] = setInterval(function() {
      var cdEl = document.getElementById("cd-" + id);
      var upEl = document.getElementById("up-" + id);

      // Decrement timer countdown
      if (cdEl && cdEl.textContent) {
        var t = cdEl.textContent;
        var p = t.match(/(\d+)/g);
        if (p && p.length > 0) {
          var s = 0;
          if (t.indexOf("h") > -1) s = parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
          else if (t.indexOf("m") > -1) s = parseInt(p[0])*60 + parseInt(p[1]);
          else s = parseInt(p[0]);
          s--;
          if (s <= 0) {
            cdEl.textContent = "";
            clearInterval(window["intv_" + id]);
            refresh();
          } else {
            cdEl.textContent = "Auto-stops in " + fmt(s);
          }
        }
      }

      // Increment uptime
      if (upEl && upEl.textContent) {
        var up = upEl.textContent.match(/(\d+)/g);
        if (up && up.length > 0) {
          var ut = upEl.textContent;
          var total = 0;
          if (ut.indexOf("h") > -1) total = parseInt(up[0])*3600 + parseInt(up[1])*60 + parseInt(up[2]);
          else if (ut.indexOf("m") > -1) total = parseInt(up[0])*60 + parseInt(up[1]);
          else total = parseInt(up[0]);
          upEl.textContent = "Running for " + fmt(total + 1);
        }
      }
    }, 1000);
  }
}

function setLoading(ns, name) {
  var id = ns + "-" + name;
  var dot = document.getElementById("dot-" + id);
  var label = document.getElementById("label-" + id);
  if (dot) dot.className = "dot loading";
  if (label) label.textContent = "...";
  var btn = document.getElementById("btn-" + id);
  if (btn) btn.disabled = true;
  document.getElementById("err-" + id).style.display = "none";
  ["ar-", "sr-", "lr-"].forEach(function(pfx) {
    var r = document.getElementById(pfx + id);
    if (r) r.querySelectorAll("button").forEach(function(b) { b.disabled = true; });
  });
}

async function refresh() {
  try {
    var r = await authFetch("/api/status");
    if (!r.ok) throw new Error(await r.text());
    var data = await r.json();
    data.forEach(setUI);
  } catch (e) { console.error("Refresh:", e); }
}

async function toggle(ns, name, hours) {
  setLoading(ns, name);
  try {
    var opts = { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" };
    if (hours) { opts.body = JSON.stringify({ hours: hours }); }
    var r = await authFetch("/api/toggle/" + ns + "/" + name, opts);
    if (!r.ok) throw new Error(await r.text());
    setUI(await r.json());
  } catch (e) {
    var el = document.getElementById("err-" + ns + "-" + name);
    if (el) { el.textContent = e.message; el.style.display = "block"; }
    refresh();
  }
}

async function init() {
  try {
    var r = await authFetch("/api/status");
    if (!r.ok) throw new Error(await r.text());
    var data = await r.json();
    container.innerHTML = data.map(cardHTML).join("");
    data.forEach(setUI);
  } catch (e) {
    container.innerHTML = '<div class="card" style="color:#f87171;text-align:center">Failed to load: ' + e.message + '</div>';
  }
}

init();
setInterval(refresh, 15000);

// ===== Wheel of Fortune =====
var LUCKY_SEGMENTS = [
  { label: "+3h  — Escaped the tar pit", value: 3, color: "#FF6B6B" },
  { label: "-30m — Coffee > Code", value: -0.5, color: "#FECA57" },
  { label: "+1h30m — Yak shaving champ", value: 1.5, color: "#48DBFB" },
  { label: "-2h  — rm -rf /etc", value: -2, color: "#FF9FF3" },
  { label: "+5m  — Atomic commit™", value: 5/60, color: "#54A0FF" },
  { label: "-1h  — Standup ran long", value: -1, color: "#5F27CD" },
  { label: "+2h15m — It compiled! 🎉", value: 2.25, color: "#01A3A4" },
  { label: "-45m — git blame is you", value: -0.75, color: "#F368E0" },
  { label: "+10m — Quick fix™", value: 10/60, color: "#FF9F43" },
  { label: "-3h  — Impostor syndrome", value: -3, color: "#EE5A24" },
  { label: "+2h  — Bikeshedding", value: 2, color: "#0ABDE3" },
  { label: "+0s  — Free square!", value: 0, color: "#10AC84" },
];

var luckyNs = null;
var luckyName = null;
var luckySpinning = false;
var luckyCancel = false;

function formatWheelValue(v) {
  var totalSec = Math.round(Math.abs(v) * 3600);
  var h = Math.floor(totalSec / 3600);
  var m = Math.floor((totalSec % 3600) / 60);
  var s = totalSec % 60;
  var sign = v >= 0 ? "+" : "−";
  if (h > 0) return sign + h + "h " + m + "m " + s + "s";
  if (m > 0) return sign + m + "m " + s + "s";
  return sign + s + "s";
}

function openLucky(ns, name) {
  luckyNs = ns;
  luckyName = name;
  luckyCancel = false;
  document.getElementById("lucky-modal").style.display = "flex";

  document.getElementById("lucky-result").style.display = "none";

  var spinBtn = document.getElementById("spin-btn");
  spinBtn.style.display = "block";
  spinBtn.textContent = "🎰 SPIN!";
  spinBtn.disabled = false;

  document.getElementById("lucky-apply-btn").style.display = "none";
  drawWheel(0);
  luckySpinning = false;
}

function closeLucky() {
  luckyCancel = true;
  document.getElementById("lucky-modal").style.display = "none";
}

function drawWheel(rotation) {
  var canvas = document.getElementById("lucky-canvas");
  var ctx = canvas.getContext("2d");
  var W = canvas.width;
  var H = canvas.height;
  var cx = W / 2, cy = H / 2;
  var R = Math.min(cx, cy) - 8;
  var n = LUCKY_SEGMENTS.length;
  var segAngle = (2 * Math.PI) / n;

  ctx.clearRect(0, 0, W, H);

  // Draw segments
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  for (var i = 0; i < n; i++) {
    var startAngle = i * segAngle;
    var endAngle = (i + 1) * segAngle;

    // Segment fill
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = LUCKY_SEGMENTS[i].color;
    ctx.fill();

    // Segment border
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Label along the segment
    ctx.save();
    ctx.rotate(startAngle + segAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px -apple-system, sans-serif";
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 3;
    ctx.fillText(LUCKY_SEGMENTS[i].label, R - 10, 3.5);
    ctx.restore();
  }

  // Dots around the outer edge
  var dotCount = 24;
  for (var d = 0; d < dotCount; d++) {
    var da = (d / dotCount) * 2 * Math.PI;
    var dx = Math.cos(da) * (R - 2);
    var dy = Math.sin(da) * (R - 2);
    ctx.beginPath();
    ctx.arc(dx, dy, 2.5, 0, 2 * Math.PI);
    ctx.fillStyle = d % 2 === 0 ? "#FFD700" : "#fff";
    ctx.fill();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, 2 * Math.PI);
  ctx.strokeStyle = "rgba(255,215,0,0.4)";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();

  // Center circle (drawn unrotated)
  ctx.beginPath();
  ctx.arc(cx, cy, 26, 0, 2 * Math.PI);
  var grad = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, 26);
  grad.addColorStop(0, "#2a2a4e");
  grad.addColorStop(1, "#1a1a2e");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Center text
  ctx.fillStyle = "#FFD700";
  ctx.font = "bold 12px -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 4;
  ctx.fillText("LUCKY", cx, cy);
  ctx.shadowBlur = 0;
}

function spinWheel() {
  if (luckySpinning) return;
  luckySpinning = true;
  luckyCancel = false;

  var btn = document.getElementById("spin-btn");
  btn.disabled = true;
  btn.textContent = "🎰 Spinning...";

  document.getElementById("lucky-result").style.display = "none";
  document.getElementById("lucky-apply-btn").style.display = "none";

  var n = LUCKY_SEGMENTS.length;
  var segAngle = (2 * Math.PI) / n;

  // Pick random segment
  var winIndex = Math.floor(Math.random() * n);
  var segCenter = (winIndex + 0.5) * segAngle;

  // Calculate rotation to land on winIndex (pointer at top = -PI/2)
  var targetAngle = -Math.PI / 2 - segCenter;
  targetAngle = ((targetAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

  var fullSpins = 5 + Math.floor(Math.random() * 4); // 5-8 full rotations
  var totalRotation = targetAngle + fullSpins * 2 * Math.PI;

  // Animate
  var duration = 4000 + Math.random() * 1500;
  var startTime = null;

  function animate(timestamp) {
    if (luckyCancel) { luckySpinning = false; return; }
    if (!startTime) startTime = timestamp;
    var elapsed = timestamp - startTime;
    var progress = Math.min(elapsed / duration, 1);

    // Quartic ease-out for dramatic deceleration
    var eased = 1 - Math.pow(1 - progress, 4);
    drawWheel(totalRotation * eased);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      luckySpinning = false;
      showResult(winIndex);
    }
  }

  requestAnimationFrame(animate);
}

function showResult(winIndex) {
  var seg = LUCKY_SEGMENTS[winIndex];
  document.getElementById("spin-btn").style.display = "none";

  var resultEl = document.getElementById("lucky-result");
  resultEl.style.display = "block";
  resultEl.innerHTML =
    '<div class="result-emoji">🎊</div>' +
    '<div class="result-value">' + formatWheelValue(seg.value) + '</div>' +
    '<div class="result-label">' + seg.label + '</div>';

  var applyBtn = document.getElementById("lucky-apply-btn");
  applyBtn.style.display = "block";
  applyBtn.textContent = "✅ Apply " + formatWheelValue(seg.value) + "!";
  applyBtn.onclick = function() {
    closeLucky();
    toggle(luckyNs, luckyName, seg.value);
  };

  launchConfetti();
}

// ===== Confetti =====
function launchConfetti() {
  var container = document.getElementById("confetti-container");
  container.innerHTML = "";
  var colors = ["#FF6B6B", "#FECA57", "#48DBFB", "#FF9FF3", "#54A0FF", "#01A3A4", "#FFD700", "#FF9F43", "#F368E0", "#10AC84"];

  for (var i = 0; i < 70; i++) {
    var piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (5 + Math.random() * 7) + "px";
    piece.style.height = (5 + Math.random() * 7) + "px";
    piece.style.animationDelay = Math.random() * 2 + "s";
    piece.style.animationDuration = (2 + Math.random() * 2.5) + "s";
    piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    if (Math.random() > 0.5) {
      piece.style.boxShadow = "0 0 4px rgba(255,255,255,0.3)";
    }
    container.appendChild(piece);
  }

  setTimeout(function() { container.innerHTML = ""; }, 5000);
}
