# Network policies for the security namespace (authentik + vaultwarden).
#
# Ingress is limited to: same-namespace traffic (authentik <-> postgres/worker,
# etc.), the ingress controllers (forward-auth calls and app routing), and the
# node network (kubelet probes).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: online
        - ipBlock:
            cidr: 192.168.5.0/24
