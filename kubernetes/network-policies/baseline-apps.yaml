# Baseline network policies for application namespaces.
#
# Each namespace gets a default-deny ingress plus a single allow policy that
# permits:
#   - same-namespace traffic (so intra-namespace app links keep working, e.g.
#     the *arr stack: sonarr/radarr/bazarr/jellyseerr <-> jackett/qbittorrent,
#     and app <-> its database/redis)
#   - the ingress controllers (main + online)
#   - the monitoring namespace (Gatus probes and Prometheus scraping)
#   - the node network 192.168.5.0/24 (kubelet liveness/readiness probes and
#     LoadBalancer traffic SNAT'd by kube-proxy)
#
# App-to-app connections configured inside applications must target either the
# same namespace or egress (unrestricted); cross-namespace in-cluster
# integrations would need an explicit allow added here.
---
# ---- ai ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: online
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - ipBlock:
            cidr: 192.168.5.0/24
---
