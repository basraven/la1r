# registry namespace. Every pod and the kubelet pull images from the in-cluster
# registry, so port 5000 stays open to the pod CIDR and the node network while
# blocking external access.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: online
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - ipBlock:
            cidr: 192.168.5.0/24
    # Image pulls from all pods (and the node) on the registry port.
    - from:
        - ipBlock:
            cidr: 10.244.0.0/16
        - ipBlock:
            cidr: 192.168.5.0/24
      ports:
        - protocol: TCP
          port: 5000
