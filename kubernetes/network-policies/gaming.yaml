# gaming namespace. The enshrouded LoadBalancer uses
# externalTrafficPolicy: Local, so the real client source IP reaches the pod and
# the game ports must be open from anywhere.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gaming
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: gaming
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: online
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - ipBlock:
            cidr: 192.168.5.0/24
    # Game server LoadBalancer ports (any source, ETP=Local).
    - ports:
        - protocol: TCP
          port: 15637
        - protocol: UDP
          port: 27015
