# Apply after kubeadm init, it's only extending .bas domain
apiVersion: v1
data:
  Corefile: |
    bas:53 {
        errors
        cache 30
        forward . 192.168.6.91
    }
    
    auth.la1r.com:53 {
        errors
        cache 30
        forward . 192.168.6.91
    }
    
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
