groups:
  - name: server_target_state_jay-c
    interval: 30s  # How often the rules are evaluated

    # Recording rules (precompute metrics)
    rules:
      - record: server:target:state
        
        
        expr: |
          # 1. HTTPS DNS endpoint for past 15 mins
          SUM(increase(traefik_router_requests_total{router=~".*jelly.*"}[15m]))
          or
          # 2. HTTP IP endpoint for past 15 mins
          SUM(increase(traefik_entrypoint_requests_total{entrypoint="jellyfin"}[15m]))
          # +
          # # 3. Samba open sessions for past 15 mins
          # SUM(max_over_time(haproxy_frontend_current_sessions{proxy="samba_jayc_fe"}[15m]) )
          or
          # # 4. Jay-C Server is already online for past 15 mins
          # SUM(1 - max_over_time(probe_success{nodeName="jay-c"}[15m]))
          # +
          # 5. if manual lease is active
          # SUM(clamp_max(clamp_min(max({__name__=~"lease_jayc_.*"}) - time(), 0), 1))
          clamp_min(SUM(max({__name__=~"lease_jayc_.*"}) - time()), 0)
          
      - alert: Jay-C Server should be online
        expr: server:target:state > 0
        # for: 2m
        labels:
          severity: normal
          alertname: jayc-server-offline
        annotations:
          summary: "Jay-C Server should be online but is not"
          description: "The Jay-C Server should be online but is not"

  - name: uptime_alerts
    interval: 30s
    rules:
      - alert: ServiceUnreachable
        expr: gatus_result{success="false"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is unreachable"
          description: "Gatus probe for {{ $labels.name }} ({{ $labels.group }}) has been failing for over 2 minutes"

      - alert: HighResponseTime
        expr: gatus_result_time > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} response time is high"
          description: "{{ $labels.name }} is taking over 2 seconds to respond (current: {{ $value }}ms)"

      - alert: CertificateExpiringSoon
        expr: gatus_certificate_expiry_days < 30
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring for {{ $labels.name }}"
          description: "Certificate for {{ $labels.name }} expires in {{ $value }} days"    