apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - pv
  - prometheus-rbac.yml
  - prometheus.yml
  - exporters
  - alertmanager
  - prometheus-push-gateway


configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus-config.yml
  
  - name: prometheus-targets
    files:
      - config/targets.json
  
  - name: prometheus-rules
    files:
      - config/rules.yml