apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - pv
  - prometheus-push-gateway.yml

  # configmap based on config/start.sh
configMapGenerator:
- name: push-proxy-code
  files:
  - main.go=push-proxy/push-proxy.go
generatorOptions:
  disableNameSuffixHash: true