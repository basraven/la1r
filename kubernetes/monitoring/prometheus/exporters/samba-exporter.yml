---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba-exporter
  namespace: monitoring
  labels:
    app: samba-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba-exporter
  template:
    metadata:
      labels:
        app: samba-exporter
    spec:
      # NonEssential
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: la1r.workload/nonessential
                operator: In
                values:
                - "true"

      initContainers:
      - name: install-samba-exporter
        image: ubuntu:24.10
        command:
          - /bin/bash
          - -c
          - |
            apt update && apt install -y wget binutils tar
            wget https://github.com/imker25/samba_exporter/releases/download/1.3.5-pre/samba-exporter_1.3.5-pre.ppa1.debian10_amd64.deb
            # Unpack the .deb file manually (extract binary without installing dependencies)
            ar x samba-exporter_1.3.5-pre.ppa1.debian10_amd64.deb
            tar -xf data.tar.xz ./usr/local/bin/samba-exporter
            mv ./usr/local/bin/samba-exporter /samba-exporter/samba-exporter
            # Cleanup to reduce image size in the main container
            rm -f samba-exporter_1.3.5-pre.ppa1.debian10_amd64.deb
            rm -f data.tar.xz
        volumeMounts:
          - name: samba-exporter-bin
            mountPath: /samba-exporter  # Mount point to share the binary with the main container
          - name: proc
            mountPath: /host/proc
            readOnly: true
          - name: smbstatus
            mountPath: /usr/bin/smbstatus
            readOnly: true
      containers:
      - name: samba-exporter
        image: ubuntu:24.10
        command:
            - /bin/bash
            - -c
            - |
              # Run samba-exporter after it was installed by the init container
              /samba-exporter/samba-exporter --smbstatus /usr/bin/smbstatus --procfs /host/proc
        resources:
        ports:
        - containerPort: 9150 # Default exporter port
        volumeMounts:
        - name: samba-exporter-bin
          mountPath: /samba-exporter  # Mount to run samba-exporter from the shared volume
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: smbstatus
          mountPath: /usr/bin/smbstatus
          readOnly: true

      volumes:
        - name: samba-exporter-bin
          emptyDir: {}  # Temporary storage to share the Samba Exporter binary between init container and main container
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: smbstatus
          hostPath:
            path: /usr/bin/smbstatus
            type: File
            
        - name: samba-config-volume
          configMap:
            name: samba-config
            items:
              - key: blackbox.yml
                path: blackbox.yml
            defaultMode: 0744
---
apiVersion: v1
kind: Service
metadata:
  labels:
    task: monitoring
  name: samba-exporter
  namespace: monitoring
spec:
  ports:
  - port: 9150
    targetPort: 9150
  selector:
    app: samba-exporter

