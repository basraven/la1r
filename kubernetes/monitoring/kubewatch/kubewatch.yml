---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubewatch
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubewatch
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubewatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubewatch
subjects:
  - kind: ServiceAccount
    name: kubewatch
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewatch
  namespace: monitoring
  labels:
    app: kubewatch
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubewatch
  template:
    metadata:
      labels:
        app: kubewatch
        task: monitoring
    spec:
      serviceAccountName: kubewatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - jay-c
      containers:
      - name: kubewatch
        image: robustadev/kubewatch:v2.9.0
        imagePullPolicy: IfNotPresent
        env:
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: config-volume
          mountPath: /opt/bitnami/kubewatch
      - name: kubewatch-filter
        image: python:3-alpine
        imagePullPolicy: IfNotPresent
        command: ["python", "/app/filter.py"]
        env:
        - name: NTFY_URL
          value: "http://ntfy.monitoring.svc.cluster.local/k8s-status"
        volumeMounts:
        - name: filter-script
          mountPath: /app
      volumes:
      - name: config-volume
        configMap:
          name: kubewatch
      - name: filter-script
        configMap:
          name: kubewatch-filter
