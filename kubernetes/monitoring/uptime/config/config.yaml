  - name: "system-audit (HTTP:80 · <500)"
    group: monitoring
    url: "http://system-audit:80"
    interval: 60s
    conditions:
      - "[STATUS] < 500"

  # kubewatch — worker daemon, no web interface. Monitored via Prometheus pod status.

  - name: "grafana · Sablier (HTTP:80 · <500 · SAB)"
    group: monitoring
    url: "http://localhost:9090/health?deployment=grafana&namespace=monitoring&check-url=http://grafana.monitoring.svc.cluster.local:80"
