      - "[STATUS] == 200"

  - name: kubewatch
    group: monitoring
    url: "http://kubewatch:80"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  # grafana is Sablier-managed (scales to 0 when idle)
  - name: grafana
    group: monitoring
    url: "http://localhost:9090/health?deployment=grafana&namespace=monitoring&check-url=http://grafana.monitoring.svc.cluster.local:80"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
