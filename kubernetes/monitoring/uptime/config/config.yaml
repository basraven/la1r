      - "[STATUS] < 500"
    alerts:
      - type: ntfy

  - name: "ntfy (HTTP:80 · ==200)"
    group: monitoring
    url: "http://ntfy:80"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: "blackbox-exporter (HTTP:80 · ==200)"
    group: monitoring
    url: "http://prometheus-blackbox-exporter:80"
