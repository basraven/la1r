# Gatus configuration — la1r Homelab Uptime Monitoring
# https://github.com/TwiN/gatus
#
# Groups are organized by Kubernetes namespace + public + nodes.
# Sablier-managed services are probed via sablier-proxy sidecar:
#   200 = healthy OR intentionally sleeping   |   503 = genuinely broken

metrics: true

storage:
  type: memory

web:
  address: 0.0.0.0
  port: 8080

ui:
  title: "la1r Uptime"
  description: "Homelab service availability monitoring"
  dark-mode: true
  default-sort-by: group

alerting:
  ntfy:
    url: "http://ntfy.monitoring.svc.cluster.local"
    topic: "uptime"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

maintenance:
  enabled: true
  every: ["Sunday"]
  timezone: "UTC"
  start: "02:00"
  duration: "4h"

endpoints:
  # =========================================================================
  # PUBLIC — internet-facing services
  # Probed via internal LB IPs with Host headers to avoid DNS hairpin issues.
  # Accept non-5xx responses (auth-protected services return 302/401).
  # =========================================================================
  - name: auth.la1r.com
    group: public
    url: "https://192.168.6.2"
    interval: 60s
    headers:
      Host: "auth.la1r.com"
    conditions:
      - "[STATUS] < 500"
      - "[CERTIFICATE_EXPIRATION] > 720h"
    client:
      insecure: true
    alerts:
      - type: ntfy

  - name: toggle.la1r.com
    group: public
    url: "https://192.168.6.129"
    interval: 60s
    headers:
      Host: "toggle.la1r.com"
    conditions:
      - "[STATUS] < 500"
      - "[CERTIFICATE_EXPIRATION] > 720h"
    client:
      insecure: true
    alerts:
      - type: ntfy

  # =========================================================================
  # NODES — physical hosts and appliances
  # =========================================================================
  - name: jay-c
    group: nodes
    url: "icmp://192.168.5.3"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy

  - name: homeassistant
    group: nodes
    url: "icmp://192.168.8.1"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: samba
    group: nodes
    url: "tcp://192.168.5.103:445"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: unifi-controller
    group: nodes
    url: "tcp://192.168.5.243:8443"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: api-gateway
    group: nodes
    url: "tcp://192.168.5.100:443"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  # =========================================================================
  # monitoring namespace
  # =========================================================================
  - name: prometheus
    group: monitoring
    url: "http://prometheus:9090"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: alertmanager
    group: monitoring
    url: "http://alertmanager-service:9093"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: grafana-mcp
    group: monitoring
    url: "http://grafana-mcp:80"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: ntfy
    group: monitoring
    url: "http://ntfy:80"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: blackbox-exporter
    group: monitoring
    url: "http://prometheus-blackbox-exporter:80"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: push-gateway
    group: monitoring
    url: "http://prometheus-push-gateway:80"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: system-audit
