# Gatus configuration — la1r Homelab Uptime Monitoring
# https://github.com/TwiN/gatus
#
# Endpoint naming:  name (PROBE:port · condition)
#   PROBE  = HTTP | HTTPS | TCP | ICMP | DNS
#   <500   = accepts any non-5xx response (auth-protected services)
#   ==200  = strict 200 OK required
#   CONN   = TCP connect only
#   SSL    = certificate expiry check included
#   SAB    = Sablier-aware (probed via sablier-proxy)

metrics: true

storage:
  type: memory

web:
  address: 0.0.0.0
  port: 8080

ui:
  title: "la1r Uptime"
  description: "Homelab service availability monitoring"
  dark-mode: true
  default-sort-by: group

alerting:
  ntfy:
    url: "http://ntfy.monitoring.svc.cluster.local"
    topic: "uptime"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

maintenance:
  enabled: true
  every: ["Sunday"]
  timezone: "UTC"
  start: "02:00"
  duration: "4h"

endpoints:
  # =========================================================================
  # PUBLIC — internet-facing (probed via LB IPs with Host headers)
  # =========================================================================
  - name: "auth.la1r.com (HTTPS · <500 · SSL)"
    group: 1-public
    url: "https://192.168.6.2"
    interval: 60s
    headers:
      Host: "auth.la1r.com"
    conditions:
      - "[STATUS] < 500"
      - "[CERTIFICATE_EXPIRATION] > 720h"
    client:
      insecure: true
    alerts:
      - type: ntfy

  - name: "toggle.la1r.com (HTTPS · <500 · SSL)"
    group: 1-public
    url: "https://192.168.6.129"
    interval: 60s
    headers:
      Host: "toggle.la1r.com"
    conditions:
      - "[STATUS] < 500"
      - "[CERTIFICATE_EXPIRATION] > 720h"
    client:
      insecure: true
    alerts:
      - type: ntfy

  # Public DNS — verify .la1r.com resolves from inside the cluster
  - name: "la1r.com (DNS · A record)"
    group: 1-public
    url: "dns://la1r.com"
    interval: 120s
    conditions:
      - "[BODY] != 0.0.0.0"
    dns:
      query-type: A
      query-name: "la1r.com"

  # =========================================================================
  # NODES — physical hosts and appliances
  # =========================================================================
  - name: "jay-c · K8s server (ICMP)"
    group: 2-nodes
    url: "icmp://192.168.5.3"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy

  - name: "homeassistant · HA Yellow (ICMP)"
    group: 2-nodes
    url: "icmp://192.168.8.1"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: "samba · NAS storage (TCP:445)"
    group: 2-nodes
    url: "tcp://192.168.5.103:445"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: "unifi-controller (TCP:8443)"
    group: 2-nodes
    url: "tcp://192.168.5.243:8443"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: "api-gateway (TCP:443)"
    group: 2-nodes
    url: "tcp://192.168.5.100:443"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  # DNS — verify internal .bas domains resolve
  - name: "status.bas (DNS · A record)"
    group: 2-nodes
    url: "dns://status.bas"
    interval: 120s
    conditions:
      - "[BODY] != 0.0.0.0"
    dns:
      query-type: A
      query-name: "status.bas"

  - name: "grafana.bas (DNS · A record)"
    group: 2-nodes
    url: "dns://grafana.bas"
    interval: 120s
    conditions:
      - "[BODY] != 0.0.0.0"
    dns:
      query-type: A
      query-name: "grafana.bas"

  # =========================================================================
  # monitoring namespace
  # =========================================================================
  - name: "prometheus (HTTP:9090 · ==200)"
    group: monitoring
    url: "http://prometheus:9090"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: "alertmanager (HTTP:9093 · ==200)"
    group: monitoring
    url: "http://alertmanager-service:9093"
