server {
    listen 80;

    root /usr/share/nginx/html;

    # --- SPA static files ---
    location = /index.html {
    }
    location ~ ^/work\.[a-f0-9]+\.(js|css)$ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # --- Kitchen Kiosk dashboard (proxied to HA at its native path) ---
    location /dashboard-kitchenkiosk/ {
        proxy_pass http://homeassistant.homeautomation.svc.cluster.local:8123/dashboard-kitchenkiosk/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip headers that block iframe embedding
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- HA native resource paths ---
    location /frontend_latest/ {
        proxy_pass http://homeassistant.homeautomation.svc.cluster.local:8123;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
    location /frontend_es5/ {
        proxy_pass http://homeassistant.homeautomation.svc.cluster.local:8123;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
    location /static/ {
        proxy_pass http://homeassistant.homeautomation.svc.cluster.local:8123;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
    location /api/ {
        proxy_pass http://homeassistant.homeautomation.svc.cluster.local:8123;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /auth/ {
        proxy_pass http://homeassistant.homeautomation.svc.cluster.local:8123;
        proxy_set_header Host $host;
    }
    location /hacsfiles/ {
        proxy_pass http://homeassistant.homeautomation.svc.cluster.local:8123;
        proxy_set_header Host $host;
    }

    # --- Catch-all: serve SPA index.html for any unmatched path ---
    location / {
        try_files $uri /index.html;
    }
}
